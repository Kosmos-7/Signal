}
/* RELEVÉ AU SURVOL ET AU DOIGT sur le graphique des barres (demandes du
   propriétaire, 07/08 : « quand je passe la souris ou le doigt sur un pilier
   des graphs je veux pouvoir voir le montant », puis « regarde comment Baggr
   affiche le résultat au survol, je veux pareil »).

   FAÇON BAGGR, donc : une carte FLOTTANTE posée à côté de la colonne visée,
   du côté où il y a de la place, cachée au repos — pas le bandeau docké du
   graphique de cours. La hauteur est fixe : la carte suit la colonne en X,
   jamais le pointeur en Y, sinon elle tremble sous le doigt.

   COLONNE LA PLUS PROCHE, pas colonne survolée : une barre fait 34 unités de
   large dans un slot qui peut en faire 18 — viser la barre elle-même est
   impossible au doigt. On prend l'abscisse la plus proche, donc tout le slot
   est cliquable. Au doigt, la carte RESTE après qu'on a levé le doigt : on
   lève le doigt précisément pour lire ce qu'il cachait. */
function releveSvg(svg,tip,xs,htmls,W){
  if(!svg||!tip||!xs.length)return;
  const hi=svg.querySelector('.fd-hi');
  const demi=(xs.length>1?Math.abs(xs[1]-xs[0]):40)/2;
  const cache=()=>{tip.style.display='none';if(hi)hi.setAttribute('visibility','hidden');};
  const montre=i=>{
    tip.innerHTML=htmls[i];tip.style.display='block';
    if(hi){hi.setAttribute('x',xs[i]-demi);hi.setAttribute('width',demi*2);
      hi.setAttribute('visibility','visible');}
    const rb=svg.getBoundingClientRect();if(!rb.width)return;
    const cx=xs[i]*rb.width/W, tw=tip.offsetWidth||180;
    let lx=cx+14; if(lx+tw>rb.width-2)lx=cx-tw-14;
    tip.style.left=Math.max(2,lx)+'px';
    tip.style.top=Math.round(rb.height*0.12)+'px';};
  const suit=ev=>{
    const rb=svg.getBoundingClientRect();if(!rb.width)return;
    const mx=(ev.clientX-rb.left)*W/rb.width;
    let b=0;for(let i=1;i<xs.length;i++)if(Math.abs(xs[i]-mx)<Math.abs(xs[b]-mx))b=i;
    montre(b);};
  svg.addEventListener('pointermove',suit);
  svg.addEventListener('pointerdown',suit);
  svg.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')cache();});
}
function fdPrev(arr,i,mode){
  if(mode==='an')return arr[i-1]||null;
  // même trimestre un an plus tôt, retrouvé par la date (les trous existent)
  const d0=new Date(arr[i].fin);
  return arr.find(p=>{const j=(d0-new Date(p.fin))/864e5;return j>330&&j<400;})||null;
}
/* Phrases de synthèse (décision propriétaire du 06/08) : la table donne les
   points, ces phrases donnent la TRAJECTOIRE — TCAm du CA avec ses années de
   baisse, marge nette moyenne et son évolution, multiple moyen réellement payé.
   Règles : purement factuel (aucun « solide » ou « excellent », le lecteur
   juge) ; chaque phrase exige assez d'exercices pour ne pas sur-affirmer
   (≥ 4) ; une période avec pertes dit ses pertes, pas une marge moyenne qui
   les maquillerait. Pur : ne lit que les exercices publiés. */
function fdSynthese(an){
  const fr=v=>v.toFixed(1).replace('.',',');
  const ph=[];
  const cas=an.filter(r=>r.ca>0);
  if(cas.length>=4){
    const n=cas.length,y0=+cas[0].fin.slice(0,4),y1=+cas[n-1].fin.slice(0,4);
    let baisse=0;for(let i=1;i<n;i++)if(cas[i].ca<cas[i-1].ca)baisse++;
    if(y1>y0){
      const tcam=(Math.pow(cas[n-1].ca/cas[0].ca,1/(y1-y0))-1)*100;
      ph.push('Sur les '+n+' derniers exercices publiés ('+y0+'-'+y1+'), le chiffre d\'affaires a '
        +(tcam>=0?'progressé':'reculé')+' de <b>'+fr(Math.abs(tcam))+' % par an</b> en moyenne, '
        +(baisse===0?'sans exercice de baisse.':'avec '+baisse+' exercice'+(baisse>1?'s':'')+' de baisse.'));
    }
  }
  const marges=an.filter(r=>r.ca>0&&r.rn!=null);
  if(marges.length>=4){
    const pertes=marges.filter(r=>r.rn<0).length;
    if(pertes){
      ph.push('La période compte <b>'+pertes+' exercice'+(pertes>1?'s':'')+' en perte</b>.');
    }else{
      const m=marges.map(r=>r.rn/r.ca*100);
      ph.push('Marge nette moyenne de <b>'+fr(m.reduce((a,v)=>a+v,0)/m.length)+' %</b>, passée de '
        +fr(m[0])+' % à '+fr(m[m.length-1])+' % entre le premier et le dernier exercice.');
    }
  }
  const pers=an.filter(r=>r.per!=null).map(r=>r.per);
  if(pers.length>=4){
    // Médiane et non moyenne : une seule année de bulle (NVIDIA 2021 : 300×)
    // écrase une moyenne, la médiane dit le multiple TYPIQUE de la période.
    const srt=pers.slice().sort((a,b)=>a-b), n=srt.length;
    const med=n%2?srt[(n-1)/2]:(srt[n/2-1]+srt[n/2])/2;
    ph.push('Le marché a payé ces bénéfices <b>'+Math.round(med)+'× en médiane</b> sur la période (de '
      +Math.round(Math.min(...pers))+'× à '+Math.round(Math.max(...pers))+'×).');
  }
  return ph;
}
// Profondeur DESSINÉE (le tableau dépliable, lui, montre tout l'accumulé).
const FD_ANS=10, FD_TRIM=12;
function fondaRender(s){
  const host=document.getElementById('fondasec'); if(!host)return;
  const D=CH[s.ticker], F=D&&D.fonda;
  const an=(F&&F.an)||[], tr=(F&&F.tr)||[];
  if(an.length<2&&tr.length<2){host.innerHTML='';return;}
  if(FD_MODE==='an'&&an.length<2)FD_MODE='tr';
  if(FD_MODE==='tr'&&tr.length<2)FD_MODE='an';
  // On affiche TOUT l'historique accumulé (décision propriétaire du 05/08) :
  // aujourd'hui ~4 exercices et ~5 trimestres (fenêtre Yahoo), et chaque run
  // hebdomadaire en ajoute — la profondeur grandit toute seule avec le temps.
  const full=FD_MODE==='an'?an:tr, dev=F.devise||'?';

     L'accumulateur est monté à dix-neuf exercices et le graphique les montrait
     tous : vingt-quatre colonnes avec les projections, des barres de trois
     pixels, et un axe où les années se marchaient dessus. Dix ans est la
     profondeur qu'on LIT — un cycle complet, deux récessions au mieux.
     L'historique entier n'est pas perdu pour autant : le tableau dépliable
     l'affiche en entier, et la note continue de mesurer marges, croissance et
     médiane des multiples sur TOUT ce qui est accumulé. On réduit ce qu'on
     dessine, jamais ce qu'on calcule. */

     d'historique »). Mesuré sur les 93 fiches : l'EBITDA ne couvre que 31 %
     des exercices annuels publiés — Yahoo n'en donne que quatre ans, là où
     EDGAR pousse CA et résultat net à dix-huit ou dix-neuf. Sur toute fiche
     à historique profond, la colonne était une colonne de tirets. La donnée
     reste COLLECTÉE par le screener : l'accumulateur hebdomadaire la
     profondit tout seul, et le jour où elle couvrira une vraie décennie, la
     colonne pourra revenir. */
  // Étiquettes annuelles : un changement de calendrier fiscal (CDNS, début
  // janvier → fin décembre en 2011) fait coexister deux exercices clos la
  // même année civile — on les distingue par le mois plutôt que d'afficher
  // deux fois « 2011 ».
  const anDup={};if(FD_MODE==='an')full.forEach(r=>{const y=r.fin.slice(0,4);anDup[y]=(anDup[y]||0)+1;});
  const MABR=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  const lab=r=>{const b=fdLabel(r.fin,FD_MODE);return (FD_MODE==='an'&&anDup[r.fin.slice(0,4)]>1)?b+' ('+MABR[+r.fin.slice(5,7)-1]+')':b;};
  /* PER ARRONDIS (décision du propriétaire, 07/08). La décimale d'un multiple
     est du faux précis : entre 20,8× et 21× il n'y a aucune information, et
     la virgule alourdit une colonne qu'on parcourt du regard. Le graphique
     arrondissait déjà ; le tableau s'aligne. */
  const fmtPer=v=>v!=null?Math.round(v)+'×':'—';
  // barres : CA et RN par période, dernière période en pleine intensité.
  // Largeur du viewBox ADAPTÉE au conteneur : à 800 unités sur un écran de
  // 390 px, les étiquettes rendaient ~5 px — illisibles (vérification adverse).
  const NARROW=host.clientWidth>0&&host.clientWidth<640;
  // Projections (mode annuel seulement) : le consensus des analystes sur deux
  // exercices puis notre prolongation jusqu'en 2030. Elles sont HACHURÉES et
  // séparées du publié par un trait vertical — on ne mélange jamais un chiffre
  // déposé et un chiffre attendu.
  const proj=(FD_MODE==='an'&&Array.isArray(F.proj))?F.proj:[];
  // Ce graphique porte le CA et le résultat net : une année projetée sans CA
  // (le CA s'arrête, le BPA continue) ne doit pas ouvrir une colonne vide.
  const projC=proj.filter(p=>p.ca!=null);

     manque le bénéfice net prévisionnel dans les graphs »). Le consensus est
     par action ; le montant est BPA × nombre d'actions déduit du dernier
     exercice publié (résultat net ÷ BPA) — même déduction, même hypothèse
     d'actions constantes que le tableau de trajectoire, écrite là-bas. Le
     nombre d'actions est calculé ICI, une seule fois, et le tableau plus bas
     réutilise le même : deux calculs finiraient par diverger. */
  /* Le nombre d'actions se déduit du rapport résultat net ÷ bénéfice par
     action. Il exigeait les DEUX positifs — ce qui privait de barres toute
     société en perte, alors que le rapport de deux nombres NÉGATIFS donne
     exactement le même nombre d'actions (CoreWeave 2025 : −1 167 ÷ −2,81 =
     415 millions de titres). Ce qu'il faut, c'est un rapport positif, pas des
     termes positifs. On remonte l'historique jusqu'au premier exercice
     exploitable plutôt que d'abandonner sur le dernier. */
  const _derEx=an.filter(e=>e.rn!=null&&e.eps&&e.rn/e.eps>0).slice(-1)[0];
  const actions=_derEx?_derEx.rn/_derEx.eps:null;
  const rnAtt=p=>(p.eps!=null&&actions)?p.eps*actions:null;
  const cols=rows.map(r=>({v:r,pr:false})).concat(projC.map(p=>({v:p,pr:true})));
  const W=NARROW?440:800,H=170,PB=22,n=cols.length;
  const val=(o,k)=>o.v[k]==null?null:o.v[k];
  const maxV=Math.max(...cols.map(o=>Math.max(val(o,'ca')||0,val(o,'rn')||0,o.pr?(rnAtt(o.v)||0):0,1)));

     garde-fous : le log exige que TOUT soit positif (une perte n'a pas de
     logarithme — NBIS reste donc en linéaire), et ne se déclenche qu'à
     partir d'un rapport de 15 entre le plus grand et le plus petit CA
     dessinés — Alphabet (×9) garde son échelle linéaire, où les hauteurs se
     comparent en différence, la lecture la plus naturelle. */
  const _rnDe=o=>o.pr?rnAtt(o.v):o.v.rn;
  const tousPos=cols.every(o=>{const r=o.v,rv=_rnDe(o);return (r.ca==null||r.ca>0)&&(rv==null||rv>0);});
  const _cas=cols.map(o=>o.v.ca).filter(v=>v!=null&&v>0);
  const LOGB=tousPos&&_cas.length>1&&Math.max(..._cas)/Math.min(..._cas)>15;
  const _minPos=LOGB?Math.min(...cols.flatMap(o=>[o.v.ca,_rnDe(o)]).filter(v=>v!=null&&v>0)):1;
  // Plancher un peu sous la plus petite valeur : la plus petite barre garde
  // une hauteur visible au lieu de partir de zéro pixel.
  const _la=Math.log(_minPos/1.6), _lb=Math.log(maxV);
  const minV=LOGB?0:Math.min(0,...cols.map(o=>Math.min(val(o,'rn')==null?0:val(o,'rn'),0)));
  const y0=8+(H-PB-16)*(maxV/(maxV-minV)), sc=(H-PB-16)/(maxV-minV);
  // Hauteur d'une barre — l'UNIQUE conversion valeur→pixels, partagée par le
  // CA, sa borne haute et le résultat net : deux conversions divergeraient.
  const hVal=v=>LOGB?(Math.log(v)-_la)/(_lb-_la)*(H-PB-16):v*sc;
  const slot=W/n, bw=Math.min(34,slot*0.22);
  let bars='<defs><pattern id="fdhach" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
    '<line x1="0" y1="0" x2="0" y2="5" stroke="#74b6df" stroke-width="2.4"/></pattern>'+
    '<pattern id="fdhach2" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
    '<line x1="0" y1="0" x2="0" y2="5" stroke="#c6c6e0" stroke-width="2.4"/></pattern></defs>'+
    // La bande de survol est posée EN PREMIER : elle doit passer derrière les
    // barres, pas par-dessus.
    '<rect class="fd-hi" x="0" y="0" width="0" height="'+(H-PB+4)+'" visibility="hidden"/>'+
    '<line x1="0" x2="'+W+'" y1="'+y0+'" y2="'+y0+'" stroke="rgba(255,255,255,.10)"/>';
  if(projC.length){const xSep=slot*rows.length;
    bars+='<line x1="'+xSep+'" x2="'+xSep+'" y1="4" y2="'+(H-PB+2)+'" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 3"/>';}
  // ÉTIQUETTES : le pas se déduit de la PLACE, il n'est plus deviné. « une sur
  // deux » suffisait à douze colonnes ; à vingt-quatre (dix-neuf exercices
  // publiés plus cinq projetés) sur 440 unités de large, « 2024 2025 2026 » se
  // chevauchait — signalé par le propriétaire sur son téléphone. On mesure
  // donc : un libellé fait ~6,2 unités par caractère à cette taille, il lui
  // faut son slot plus une marge.
  const LARG_CAR=6.2, LARG_LAB=4*LARG_CAR+6;
  const step=Math.max(1,Math.ceil(LARG_LAB/slot));
  /* Contenu du relevé, une entrée par colonne. Il ne dit QUE ce que le dessin
     dessine — CA et résultat net : annoncer dans une bulle un chiffre qui n'a
     pas de barre ferait chercher au lecteur une barre qui n'existe pas. */
  const relX=[], relH=[];
  cols.forEach((o,i)=>{
    const r=o.v;
    /* MÊME VARIATION QUE LE TABLEAU, pas une deuxième. Pour le publié on
       reprend `fdPrev` — donc, en trimestriel, le MÊME trimestre un an plus
       tôt et non le trimestre précédent : deux « ▲ 15 % » différents pour la
       même barre selon qu'on la survole ou qu'on la lit dans le tableau
       seraient une incohérence pure. Pour l'attendu (annuel seulement, et
       absent du tableau des publiés) la référence est la colonne d'avant,
       qui est le dernier exercice publié pour la première projection. */
    const prec=o.pr?(i>0?cols[i-1].v:null):fdPrev(full,full.indexOf(r),FD_MODE);
    const dlt=(champ)=>fdDelta(r,prec,champ);
    const rnA=o.pr?rnAtt(r):null;
    const rnPrec=i>0?(cols[i-1].pr?rnAtt(cols[i-1].v):cols[i-1].v.rn):null;
    // Nature par série : TSM porte un CA au consensus et un bénéfice déjà
    // prolongé la même année — une seule mention les confondrait.
    const natCa=(r.ca_nature||r.nature),natEps=(r.eps_nature||r.nature);
    const natTxt=o.pr?(rnA!=null&&natEps!==natCa
      ?'CA '+(natCa==='consensus'?'au consensus':'prolongé par nous')+' · bénéfice '+(natEps==='consensus'?'au consensus':'prolongé par nous')
      :(natCa==='consensus'?'consensus des analystes':'notre prolongation arithmétique')):'';
    relH.push('<span class="d">'+(o.pr?r.exercice+'&nbsp;· attendu':lab(r))+'</span><br>'
      +'<span style="color:#74b6df">'+(o.pr?'▨':'■')+'</span> CA&nbsp;: <span class="c">'+fdMoney(r.ca,dev)+'</span> '+dlt('ca')
      + (!o.pr&&r.rn!=null
          ?'<br><span style="color:#c6c6e0">■</span> Résultat net&nbsp;: <span class="t">'+fdMoney(r.rn,dev)+'</span> '+dlt('rn'):'')
      + (rnA!=null
          ?'<br><span style="color:#c6c6e0">▨</span> Résultat net&nbsp;: <span class="t">'+fdMoney(rnA,dev)+'</span> '+fdDelta({v:rnA},{v:rnPrec},'v'):'')
      + (natTxt?'<br><i style="color:var(--text3);font-style:normal">'+natTxt+'</i>':''));
    relX.push(slot*i+slot/2);
  });
  cols.forEach((o,i)=>{
    const r=o.v, cx=slot*i+slot/2, last=(i===rows.length-1), op=o.pr?0.9:(last?1:0.45);
    const fCa=o.pr?'url(#fdhach)':'#74b6df';
    /* PLUS DE CÔNE (décision du propriétaire, 07/08 : « je préfère qu'on
       assume une position, on ne parle pas de haut de fourchette »). Il y
       avait ici un contour en pointillé au-dessus de la barre, seconde
       branche de la prolongation. Le screener n'en publie plus qu'une, celle
       qui part du rythme du consensus — mesurée juste sur TSMC contre un
       concurrent qui publie du consensus multi-annuel. */
    if(r.ca!=null){const h=hVal(r.ca);
      bars+='<rect x="'+(cx-bw-2)+'" y="'+(h>=0?y0-h:y0)+'" width="'+bw+'" height="'+Math.max(2,Math.abs(h))+'" rx="3" fill="'+fCa+'" opacity="'+op+'"/>';
      /* PLUS D'ÉTIQUETTE AU-DESSUS DES BARRES PROJETÉES (question du
         propriétaire, 07/08 : « pourquoi il y a encore la valeur affichée
         au-dessus de la barre ? »). Elle datait d'avant la carte au survol,
         qui donne le même montant avec sa variation et sa nature — la garder
         aurait affiché le chiffre deux fois sur les grandes fiches et zéro
         fois sur les étroites, où elle ne tenait pas. */
      }
    // Résultat net : publié en plein, attendu en hachuré gris — même code
    // visuel que le CA (plein = déposé, hachures = attendu).
    const rnV=o.pr?rnAtt(r):r.rn;
    if(rnV!=null){const h=hVal(rnV), neg=rnV<0;
      bars+='<rect x="'+(cx+2)+'" y="'+(h>=0?y0-h:y0)+'" width="'+bw+'" height="'+Math.max(2,Math.abs(h))+'" rx="3" fill="'+(neg?'var(--red)':(o.pr?'url(#fdhach2)':'#c6c6e0'))+'" opacity="'+(neg?0.8:(o.pr?0.85:op*0.75))+'"/>';}
    if((n-1-i)%step===0||last){
      /* Le libellé de la DERNIÈRE colonne débordait du viewBox et sortait
         rogné (« 2030 » coupé au bord droit sur mobile) : centré, il déborde
         de sa demi-largeur. Aux deux extrémités on ancre donc le texte au
         bord plutôt qu'à son centre. */
      const txt=o.pr?String(r.exercice):lab(r), demi=txt.length*LARG_CAR/2;
      const anc=(cx+demi>W-1)?'end':(cx-demi<1?'start':'middle');
      const tx=anc==='end'?W-1:(anc==='start'?1:cx);
      bars+='<text x="'+tx+'" y="'+(H-6)+'" text-anchor="'+anc+'" class="chx-axis"'+(last?' fill="#c6c6e0"':(o.pr?' opacity=".65"':''))+'>'+txt+'</text>';}
  });
  // La table des chiffres est DÉPLIABLE (décision propriétaire du 06/08 : le
  // graphique d'abord, les chiffres si on veut) — son état survit aux bascules.
  /* Le tableau montre TOUT l'accumulé, lui : c'est le graphique qu'on allège,
     pas la donnée. Un lecteur qui déplie veut les chiffres, pas un extrait. */
  const perB=fdPerChart(F,fmtPer,NARROW?440:800,(s.breakdown||{}).trailing_pe);
  /* LE SEUL CAS QUE LA COURBE NE SAIT PAS MONTRER. Un PER prévisionnel négatif
     n'a pas de sens économique : on ne trace pas de point, donc la courbe
     s'arrête simplement — silencieusement. La tuile « PER prévisionnel » le
     disait ; elle a été retirée le 07/08 (le multiple vit sur la courbe). Il
     faut donc l'écrire ici, sinon l'information disparaît avec la tuile.
     Deux sociétés concernées aujourd'hui : NBIS et CRWV. */
  const _fwd=(s.breakdown||{}).forward_pe;
  const pertesAttendues=(_fwd!=null&&_fwd<0)
    ?'<p class="fd-inline"><i>Les analystes attendent des <b>pertes</b> sur le prochain exercice : il n\'y a pas de multiple prévisionnel à tracer — un PER négatif ne veut rien dire. La courbe s\'arrête donc au dernier bénéfice connu.</i></p>':'';
  host.innerHTML='<div class="fd-wrap"><div class="qh">Chiffres publiés</div>'+
    '<div class="fd-ctrl">'+
      '<button class="chx-pbtn'+(FD_MODE==='an'?' on':'')+'" data-fd="an"'+(an.length<2?' disabled':'')+'>Annuel</button>'+
      '<button class="chx-pbtn'+(FD_MODE==='tr'?' on':'')+'" data-fd="tr"'+(tr.length<2?' disabled':'')+'>Trimestres</button>'+
      '<span class="chx-rlbl">publié en '+sv(dev)+(LOGB?' · échelle log <span class="inf" tabindex="0" aria-label="Échelle logarithmique">i<span class="inf-tip">Échelle logarithmique : chaque cran de hauteur multiplie par le même facteur. Les hauteurs se comparent en RAPPORT, pas en différence — une croissance régulière en % donne des marches régulières. Sans elle, un chiffre d\'affaires multiplié par 80 sur la fenêtre écraserait les premières années en barres plates.</span></span>':'')+'</span></div>'+
    '<div class="fd-cwrap"><svg class="fd-svg" id="fd-bars" viewBox="0 0 '+W+' '+H+'">'+bars+'</svg>'+
    '<div class="chx-tip" id="fd-bars-tip"></div></div>'+
    '<div class="chx-legend"><span style="color:#74b6df;font-weight:700">■</span> CA&nbsp;&nbsp;<span style="color:#c6c6e0;font-weight:700">■</span> Résultat net'+
      (projC.length?'&nbsp;&nbsp;<span style="font-weight:700">▨</span> attendu'+(projC.some(p=>rnAtt(p)!=null)?'':' (CA seul)'):'')+'</div>'+
    /* Le lecteur doit savoir, sans cliquer, où s'arrête l'opinion des
       analystes et où commence notre arithmétique. */
    (function(){if(!proj.length)return '';
      /* On raconte la trajectoire du CHIFFRE D'AFFAIRES, la seule que ce
         graphique dessine — donc sa nature à elle (`ca_nature`), pas la nature
         prudente de l'année, qui bascule en « extrapolé » dès que le BPA
         l'est et ferait passer un consensus publié pour notre arithmétique. */
      const nat=p=>p.ca_nature||p.nature;
      const cons=projC.filter(p=>nat(p)==='consensus').map(p=>p.exercice);
      const ext=projC.filter(p=>nat(p)==='extrapolé').map(p=>p.exercice);
      /* L'ARRÊT : quand le rythme attendu dépasse ce que nos sources savent
         prolonger, le screener ne publie PAS de prolongation — il publie le
         motif. Une projection qu'on sait fausse ne vaut pas mieux qu'un blanc :
         elle vaut moins, parce qu'elle a l'air d'un fait. Le front dit donc
         exactement où la trajectoire s'arrête, et pourquoi. */
      const fin=projC.filter(p=>p.ca_arret)[0];
      /* CONDENSÉ LE 07/08 (« met en mode i si c'est secondaire et quand même
         utile ») : la ligne visible ne garde que la provenance — consensus
         jusqu'où, notre arithmétique ensuite — et le REFUS de prolonger,
         parce que c'est une position que nous prenons, pas une pédagogie.
         Le pourquoi (décroissance vers 3 %, borne haute, source à deux
         exercices — PAS « aucun analyste ne publie », c'était faux) part
         dans la bulle. */
      /* SUR QUOI REPOSE CETTE COURBE. Depuis qu'elle est unique et assumée,
         elle a l'autorité d'une affirmation — mais ses fondations sont très
         inégales : cinquante analystes sur Alphabet, DEUX sur Constellation
         Energy ; un désaccord de ±1 % sur Booking, ±16 % sur Nebius. Le dire
         coûte six mots et change la confiance qu'on accorde à la ligne. */
      const _cs=F.consensus||{};
      const _socle=[
        _cs.analystes?_cs.analystes+' analyste'+(_cs.analystes>1?'s':''):'',
        _cs.ecart_pct!=null?'ils divergent de ±'+String(_cs.ecart_pct).replace('.',',')+' %':''
      ].filter(Boolean).join(', ');
      return '<p class="fd-inline">Trajectoire attendue : <i>'+
        (cons.length?cons.join(' et ')+' d\'après le consensus des analystes'
          +(_socle?' ('+_socle+')':''):'')+
        (cons.length&&ext.length?', puis ':'')+
        (ext.length?ext[0]+'-'+ext[ext.length-1]+' prolongés par nous':'')+'.'+
        (fin?' Au-delà de '+fin.exercice+', nous n\'avançons rien : '+fin.ca_arret+'.':'')+
        /* UNE POSITION, PAS UNE FOURCHETTE (décision du propriétaire, 07/08).
           La bulle disait « carnet de commandes », ce qui laissait croire
           qu'une donnée de carnet existait quelque part — elle n'existe pas.
           Elle dit maintenant la règle réelle, en une phrase vérifiable. */
        /* L'HYPOTHÈSE DU NOMBRE D'ACTIONS vivait sous le tableau de
           trajectoire, retiré le 07/08. Elle ne pouvait pas partir avec lui :
           les barres de bénéfice attendu en dépendent entièrement. */
        '</i> <span class="inf" tabindex="0" aria-label="Comment est construite la trajectoire">i<span class="inf-tip">Notre source de consensus s\'arrête à deux exercices. Au-delà, nous partons du rythme que les analystes projettent et le faisons décroître vers 3 %/an — une projection à taux constant est le mensonge classique de l\'exercice. Au-delà de 50 %/an, nous ne prolongeons plus du tout : nous le disons plutôt que de publier un chiffre amorti qu\'on sait faux.'+
        (actions!=null&&proj.some(p=>p.eps!=null)
          ?' Le bénéfice attendu est le consensus PAR ACTION multiplié par les '+(actions/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' milliards de titres déduits du dernier exercice publié (résultat net ÷ bénéfice par action) : il suppose un nombre d\'actions CONSTANT, ce qui est faux pour une société qui rachète les siens.':'')+
        '</span></span></p>';})()+
    (function(){const syn=fdSynthese(an);return syn.length?'<div class="fd-syn">'+syn.map(x=>'<p>'+x+'</p>').join('')+'</div>':'';})()+
    /* LES TROIS FONDAMENTAUX FRAIS, à côté des exercices qu'ils prolongent
       (déplacés le 07/08 : ils flottaient dans une rangée de tuiles isolée).
       Ils disent où en est la société AUJOURD'HUI là où le graphique et les
       phrases de synthèse racontent plusieurs années — d'où la date de
       référence, qui les suit dans son « i ». */
    (function(){const _b=s.breakdown||{};
      const t=[['Croiss CA · a/a',pc(fs,_b.rev_growth_pct,1)],
               ['Marge nette · TTM',pc(f,_b.net_margin_pct,1)],
               ['Marge FCF · TTM',pc(f,_b.fcf_margin_pct,1)]].filter(x=>x[1]!=='—');
      return t.length?'<div class="metrics fd-metrics">'+t.map(x=>mk(x[0],x[1])).join('')+'</div>'+
        '<div class="metrics-note"><span class="inf" tabindex="0" aria-label="Référence des données">i<span class="inf-tip">'+periodNote(_b)+'</span></span></div>':'';})()+
    /* PLUS DE DÉPLIANTS (décision du propriétaire, 07/08 : « ça fait doublon
       avec le graph »). Il y avait ici « Dérouler les chiffres » puis
       « Dérouler la trajectoire attendue ». Depuis que chaque colonne livre
       ses montants au survol et au doigt — CA, résultat net, variation et
       nature de la valeur — les deux tableaux répétaient le dessin.
       CE QUE ÇA COÛTE, et c'est assumé : le tableau des publiés montrait TOUT
       l'historique accumulé là où le graphique s'arrête à dix exercices. Au-delà
       de dix ans, les chiffres ne sont donc plus lisibles sur la fiche. Ils
       restent COLLECTÉS et continuent d'alimenter la note (marge médiane,
       TCAM, médiane des multiples se calculent sur tout l'accumulé). */
    /* Le tableau des ATTENDUS. Le graphique porte le chiffre d'affaires ; le
       BÉNÉFICE PAR ACTION était projeté par le screener depuis le début et
       n'était affiché NULLE PART. Il l'est ici, avec sa nature ligne à ligne :
       une série peut être du consensus quand l'autre est déjà notre
       arithmétique, et une case vide veut dire qu'on a refusé de prolonger. */
    '</div>'+
    /* Plus de tableau « Dérouler les PER » ni de relevé au survol (décisions
       du propriétaire, 07/08) : chaque point porte sa valeur directement sur
       le dessin. L'explication du changement de base de cours — écrite le
       07/08 pour répondre à sa propre question — reste accessible derrière
       le « i », plus étalée sous le graphique. */
    (perB?(perB.svg
      ?'<div class="fd-wrap"><div class="qh">Évolution du PER</div>'+perB.svg+
        '<div class="chx-legend"><span style="color:#74b6df;font-weight:700">●</span> PER de l\'exercice&nbsp;&nbsp;<span style="color:#f0c674;font-weight:700">◆</span> aujourd\'hui&nbsp;&nbsp;<span style="color:#74b6df;font-weight:700">○</span> estimé (analystes)'+(perB.med!=null?'&nbsp;&nbsp;<span style="color:#c6c6e0;font-weight:700">┅</span> médiane':'')+(perB.trous?'&nbsp;&nbsp;<span style="color:var(--red);font-weight:700">×</span> exercice sans multiple':'')+
        '&nbsp;&nbsp;<span class="inf" tabindex="0" aria-label="Comment lire ces multiples">i<span class="inf-tip">Chaque exercice est au cours que le marché cotait à sa clôture, divisé par le bénéfice publié cette année-là : c\'est ce qu\'on payait à l\'époque. Le losange « aujourd\'hui » et les estimations sont au cours du jour — un écart avec le dernier exercice vient donc autant du prix que des bénéfices.</span></span></div>'+
        pertesAttendues+'</div>'
      :'<div class="fd-wrap"><div class="qh">'+(perB.queEst?'PER estimé (analystes)':'PER')+'</div>'+
        '<div class="fd-inline">'+perB.inline+'</div>'+pertesAttendues+'</div>')
    /* Aucun exercice, aucune estimation — mais les analystes peuvent quand
       même attendre des pertes, et c'est alors la SEULE chose qu'on sache
       dire du multiple. Elle vaut d'être dite. */
    :(pertesAttendues?'<div class="fd-wrap"><div class="qh">Évolution du PER</div>'+pertesAttendues+'</div>':''));
  host.querySelectorAll('[data-fd]').forEach(b=>b.addEventListener('click',()=>{
    if(b.disabled)return;FD_MODE=b.dataset.fd;fondaRender(s);}));
  /* Les écouteurs sont posés APRÈS innerHTML, à chaque rendu : la bascule
     Annuel/Trimestres réécrit tout le bloc, les anciens nœuds partent avec
     leurs écouteurs. Rien à détacher, donc, mais rien à oublier non plus. */
  releveSvg(host.querySelector('#fd-bars'),host.querySelector('#fd-bars-tip'),relX,relH,W);
}
/* Graphique dédié à l'évolution du PER (annuel par nature, indépendant de la
   bascule Annuel/Trimestres). Axe en ANNÉES, pas en indices : un exercice sans
   multiple (perte, BPA indisponible) laisse un trou VISIBLE qui coupe le trait
   et porte un marqueur × — la vérification adverse a montré MU reliant 2022 à
   2024 en effaçant la perte de 2023. Points pleins publiés, points creux pour
   les exercices estimés (connecteur pointillé), médiane des publiés à partir
   de 3 exercices (même seuil d'honnêteté que les phrases de synthèse). Échelle
   log quand les extrêmes s'écartent de plus de 10×. CHAQUE point porte sa
   valeur — le graphique est le seul artefact, il n'y a plus ni tableau
   dépliable ni relevé au survol (décisions du 07/08) ;
   0 ou 1 exercice publié → pas de courbe artificielle, valeurs en ligne. */
function fdPerChart(F,fmtPer,W,perNow){
  /* Même fenêtre de DIX exercices que le graphique des chiffres publiés
     (décision du propriétaire, 07/08) : au-delà, les points se tassent et
     l'axe devient illisible. La MÉDIANE affichée reste celle de la fenêtre
     dessinée — sinon le trait tracé sur le graphique ne correspondrait pas
     aux points qu'on voit ; celle de tout l'historique reste dans la note. */
  const anAll=((F&&F.an)||[]).slice(-FD_ANS);
  const pub=anAll.filter(r=>r.per!=null).map(r=>({an:+r.fin.slice(0,4),per:r.per,est:false}));
  const est=((F&&F.pe_prev)||[]).map(p=>({an:p.exercice,per:p.per,est:true}));
  if(!pub.length&&!est.length)return null;
  /* LE POINT « AUJOURD'HUI ». Sans lui, cette courbe changeait de base de
     cours en silence : les exercices publiés valent au COURS DE L'ÉPOQUE,
     les estimations au COURS DU JOUR. Le lecteur voyait un saut entre le
     dernier exercice et la premiere estimation et l'attribuait aux
     bénéfices, alors qu'une bonne part venait du prix. Le PER courant est
     donc posé entre les deux, à sa place : il partage le cours des
     estimations et le bénéfice (glissant) du passé récent. */
  /* SA PLACE EST CHRONOLOGIQUE : une demi-année après le DERNIER EXERCICE
     PUBLIÉ — pas après le dernier exercice qui a un multiple. La différence
     a mordu sur Coherent (signalé par le propriétaire, 07/08) : trois
     exercices de pertes après 2022, et le losange « aujourd'hui » se posait
     après 2022, AVANT les croix de 2023-2025 — un aujourd'hui dans le passé. */
  const derAn=anAll.length?+anAll[anAll.length-1].fin.slice(0,4):(pub.length?pub[pub.length-1].an:0);
  const now=(perNow!=null&&perNow>0&&pub.length)
    ?{an:derAn+0.5,per:perNow,est:false,now:true,lab:'auj.'}:null;
  // La médiane reste calculée sur TOUT l'historique accumulé, même si le
  // dessin n'en montre que dix : c'est elle que la note compare au multiple.
  const pubTout=((F&&F.an)||[]).filter(r=>r.per!=null).map(r=>({an:+r.fin.slice(0,4),per:r.per}));
  if(pub.length<2){
    /* Sans courbe, ce repli est le SEUL endroit où le multiple apparaît :
       le PER du jour y entre donc explicitement. */
    const inline=(now?['aujourd\'hui\u00a0: '+fmtPer(now.per)]:[])
      .concat(pub.concat(est).map(p=>p.an+(p.est?'<i>e</i>':'')+'\u00a0: '+fmtPer(p.per))).join(' \u00b7 ');
    return {inline:inline,queEst:!pub.length,svg:null};
  }
  W=W||800;
  const H=190,ML=14,MR=64,MT=24,MB=22;
  const trous=anAll.filter(r=>r.per==null).map(r=>+r.fin.slice(0,4));
  const pts=pub.concat(now?[now]:[]).concat(est);
  const a0=Math.min(...pts.map(p=>p.an)),a1=Math.max(...pts.map(p=>p.an));
  const sTout=pubTout.map(p=>p.per).sort((a,b)=>a-b), nMed=sTout.length;
  const med=nMed>=3?(nMed%2?sTout[(nMed-1)/2]:(sTout[nMed/2-1]+sTout[nMed/2])/2):null;
  // La médiane entre dans l'échelle : sans cela son trait pourrait tomber hors
  // du cadre quand la fenêtre dessinée est plus chère que l'historique entier.
  const vals=pts.map(p=>p.per).concat(med!=null?[med]:[]);
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const LOG=hi/Math.max(lo,0.1)>10;
  const Y=v=>{if(LOG){const a=Math.log(lo),b=Math.log(hi);return MT+(1-(Math.log(v)-a)/((b-a)||1))*(H-MT-MB);}
    return MT+(1-(v-lo)/((hi-lo)||1))*(H-MT-MB);};
  const X=an=>ML+20+(a1>a0?(an-a0)*(W-ML-MR-40)/(a1-a0):0);
  let g='';
  /* La médiane tracée est celle de TOUT l'historique accumulé, pas des dix
     exercices dessinés : c'est CELLE-LÀ que le critère « histoire » de la note
     compare au multiple du jour, et deux médianes différentes sur la même page
     seraient un contresens. Le nombre d'exercices est écrit à côté pour que le
     trait ne semble pas sortir de nulle part. */
  if(med!=null){g+='<line x1="'+ML+'" x2="'+(W-MR+10)+'" y1="'+Y(med)+'" y2="'+Y(med)+'" stroke="rgba(198,198,224,.35)" stroke-dasharray="5 5"/>'
    +'<text x="'+(W-MR+14)+'" y="'+(Y(med)+3)+'" class="chx-axis">m\u00e9d. '+Math.round(med)+'\u00d7</text>'
    +'<text x="'+(W-MR+14)+'" y="'+(Y(med)+14)+'" class="chx-axis" opacity=".65">sur\u00a0'+nMed+'</text>';}
  const segs=[];let cur=[pub[0]];
  for(let i=1;i<pub.length;i++){if(pub[i].an-pub[i-1].an===1)cur.push(pub[i]);else{segs.push(cur);cur=[pub[i]];}}
  segs.push(cur);
  segs.filter(sg=>sg.length>1).forEach(sg=>{
    g+='<polyline points="'+sg.map(p=>X(p.an)+','+Y(p.per)).join(' ')+'" fill="none" stroke="#74b6df" stroke-width="2" stroke-linejoin="round"/>';});
  /* Le connecteur pointillé ne part du dernier point publié QUE s'il n'y a
     pas de trou entre lui et aujourd'hui : relier 2022 au losange par-dessus
     trois exercices de pertes dessinerait une continuité qui n'existe pas —
     même règle que les segments pleins, qui se coupent à chaque trou. */
  const suite=(now?[now]:[]).concat(est);
  const ancre=(pub.length&&pub[pub.length-1].an===derAn)?[pub[pub.length-1]]:[];
  if(ancre.length+suite.length>=2&&suite.length)
    g+='<polyline points="'+ancre.concat(suite).map(p=>X(p.an)+','+Y(p.per)).join(' ')+'" fill="none" stroke="#74b6df" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/>';
  trous.filter(an=>an>=a0&&an<=a1).forEach(an=>{
    g+='<text x="'+X(an)+'" y="'+(H-MB+2)+'" text-anchor="middle" fill="var(--red)" font-size="13" opacity=".8">\u00d7<title>'+an+' : exercice sans multiple (perte ou BPA indisponible)</title></text>';});
  /* TOUTES LES VALEURS SONT ÉCRITES (décision du propriétaire, 07/08 :
     « dérouler les PER n'a pas d'utilité, tout doit apparaître sur le
     graph »). L'ancien tri — quatre points remarquables, le reste omis —
     supposait un tableau dépliable en secours ; il n'existe plus. Le
     chevauchement, lui, n'a pas disparu : autour du losange, trois points
     tiennent dans une demi-année d'abscisse. Quand une étiquette serait trop
     proche de la précédente, elle passe SOUS le point au lieu d'être omise —
     deux étiquettes du même côté sont alors toujours à un slot entier l'une
     de l'autre. */
  // 10 px en unités du viewBox, police à chasse fixe : ~6 unités par
  // caractère. Les VALEURS font trois caractères (« 28× ») ; les libellés
  // d'AXE en font quatre (« auj. »), il leur faut donc plus d'air.
  const ECART_VAL=22, ECART_AXE=30;
  let dernierHaut=-1e9, dernierBas=-1e9, dernierAxe=-1e9;
  const stepX=pts.length>8?2:1;
  pts.forEach((p,i)=>{
    const cx=X(p.an),cy=Y(p.per);
    g+=p.now?'<rect x="'+(cx-4.2)+'" y="'+(cy-4.2)+'" width="8.4" height="8.4" transform="rotate(45 '+cx+' '+cy+')" fill="#f0c674" stroke="#0d0d16" stroke-width="1.5"/>'
        :p.est?'<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#06060b" stroke="#74b6df" stroke-width="2"/>'
            :'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#74b6df" stroke="#0d0d16" stroke-width="1.5"/>';
    // Le point du jour est prioritaire : il choisit son côté en premier.
    const enHaut=p.now?true:(cx-dernierHaut>=ECART_VAL);
    if(enHaut||cx-dernierBas>=ECART_VAL){
      const ly=enHaut?Math.max(11,cy-10):Math.min(H-MB-4,cy+18);
      if(enHaut)dernierHaut=cx;else dernierBas=cx;
      g+='<text x="'+cx+'" y="'+ly+'" text-anchor="middle" class="chx-axis"'+(p.est?' font-style="italic"':'')+' fill="'+(p.now?'#f0c674':(p.est?'#8a8aa6':'#c6c6e0'))+'">'+Math.round(p.per)+'\u00d7</text>';}
    if((p.now||(pts.length-1-i)%stepX===0)&&(p.now||cx-dernierAxe>=ECART_AXE)){
      dernierAxe=cx;
      g+='<text x="'+cx+'" y="'+(H-4)+'" text-anchor="middle" class="chx-axis"'+(p.est?' font-style="italic"':'')+(p.now?' fill="#f0c674"':'')+'>'+(p.lab||(String(p.an).slice(2)+(p.est?'e':'')))+'</text>';}
  });
  return {svg:'<svg class="fd-svg" id="fd-per" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>',
    med:med,trous:trous.some(an=>an>=a0&&an<=a1)};
}
function qLabel(iso){ if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null; const [y,m,d]=iso.split('-').map(Number); return {q:'T'+(Math.floor((m-1)/3)+1)+' '+y, d:String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y}; }
// Élagage du 06/08 : les étiquettes des métriques portent déjà « a/a » et
// « TTM », seule la DATE de référence ajoute de l'information.
function periodNote(b){ const p=qLabel(b&&b.mrq);
  let t=p?('Marges sur les 12 mois glissants arrêtés au '+p.d+' ('+p.q+').')
         :'Marges sur les 12 mois glissants.';
  /* DEUX DATES, PAS UNE. La croissance du CA est calculée sur NOTRE série
     trimestrielle (celle du graphique) ; les marges TTM viennent du résumé de
     Yahoo, qui est souvent EN AVANCE d'un trimestre sur son propre endpoint
     d'états financiers. Prétendre une date unique obligerait à reculer celle
     des marges ou à avancer celle de la croissance : dans les deux cas on
     daterait faux un chiffre juste. On dit donc les deux quand elles
     diffèrent. */
  const g=qLabel(b&&b.rev_growth_fin);
  if(g) t+=(p&&b.rev_growth_fin!==b.mrq)
    ? ' La croissance du CA porte sur '+g.q+' (clos le '+g.d+'), dernier trimestre de notre historique — Yahoo publie ses marges avec un trimestre d\'avance sur ses états financiers.'
    : ' La croissance du CA compare '+g.q+' au même trimestre un an plus tôt.';
  /* Un douze-mois-glissant et un exercice clos peuvent diverger fortement sans
     que rien ne soit faux : un retournement de cycle met douze mois à
     traverser un exercice. On le dit plutôt que de laisser le lecteur croire
     que l'un des deux chiffres est une erreur. */
  const ex=b&&b.net_margin_exercice_pct, tt=b&&b.net_margin_pct;
  if(ex!=null&&tt!=null&&Math.abs(ex-tt)>20)
    t+=' Attention : sur le dernier exercice CLOS, la marge nette était de '+f(ex,1)+
       ' % — l\'écart avec les 12 mois glissants vient d\'un retournement en cours, pas d\'une erreur.';
  return t; }
/* Fiche d'un titre thématique hors watchlist principale : universe.json ne
   porte qu'un breakdown compact (ni fondamentaux détaillés, ni graphique, ni
fiche éditoriale). On publie ce qu'on a, et on le DIT, l'absence est un
   choix éditorial explicite, pas une panne. */
function compactMetrics(s){const b=s.breakdown||{},u=s._u||{};
  const dev=u.devise?' '+u.devise:'';
  const dl=b.decote_pct==null?'Écart trajectoire':(b.decote_pct>=0?'Sous sa trajectoire':'Au-dessus trajectoire');
  return '<div class="metrics">'+
    mk('Cours',(u.prix!=null?f(u.prix,2)+dev:'—'))+
    mk('Cross',(b.cross_type||'neutre')+(b.cross_days_ago!=null?' '+b.cross_days_ago+'j':''))+
    mk(dl,ecartTendance(b.decote_pct))+
    mk('Z-score'+(b.regression_window_years?' · '+b.regression_window_years+' ans':''),fs(b.regression_z,1).replace('.',',')+'σ')+
    mk('RSI',f(b.rsi,0))+
    mk('Objectif consensus',(b.target_upside_pct==null?'—':fs(b.target_upside_pct,0)+'%')+(b.target_analysts?' ('+b.target_analysts+')':''))+
  '</div><div class="metrics-note"><span class="inf" tabindex="0" aria-label="Référence des données">i<span class="inf-tip">Chiffres issus du même run du screener que la watchlist principale'+(U.updated_at?' ('+sv(U.updated_at)+')':'')+'.</span></span></div>';}
/* Titre sans AUCUNE fiche : ne devrait plus arriver depuis que l'éditorial
   couvre tout l'univers tagué, mais un run partiel (budget de temps épuisé)
   peut encore laisser un titre sans texte. On le dit plutôt que d'afficher
   une page à trous. */
function liteNote(){
  return '<div class="lite-note"><h4>Analyse pas encore rédigée</h4>'+
'<p>Ce titre est scoré par exactement la même méthode que les autres ; son analyse rédigée arrivera à une prochaine mise à jour hebdomadaire.</p>'+
  '<p><a href="apprendre.html">Comment lire ces chiffres →</a></p></div>';
}
/* Fiche courte sans actu : AUCUN message (décision du 06/08/2026 — l'ancien
   encart « Fiche courte » expliquait l'absence d'actualité ; soit on a de
   l'actu fiable et on l'affiche, soit on ne dit rien). La rubrique Actu est
   simplement omise, cf. le rendu de la prose plus bas. */
/* Bandeau de thème au-dessus de la fiche. La vue liste intermédiaire a été
   supprimée (elle dupliquait le rail), mais la thèse, son inversion et ses
   biais ne doivent pas disparaître pour autant : c'est la couche d'honnêteté
   du dispositif. Repliée par défaut pour ne pas manger la fiche. */
function themeBar(meta){
  if(!meta||meta.id===MAIN||!meta.thesis)return '';
  const deg=meta.status==='degraded'?'<span class="tb-deg">couverture partielle</span>':'';
  const cnt=meta.eligibles!=null?meta.scores+' retenus / '+meta.eligibles+' éligibles'
                                :meta.scores+' titres';
  return '<details class="tbar"><summary><span class="tb-k">'+sv(KIND[meta.kind]||meta.kind||'')+
    '</span><span class="tb-l">'+sv(meta.label)+'</span><span class="tb-c">'+cnt+'</span>'+deg+
    '<span class="tb-x">thèse ▾</span></summary><div class="tb-body">'+
    '<p>'+sv(meta.thesis)+'</p>'+
    (meta.regle_texte?'<div class="tb-n"><h5>Règle de sélection</h5><p>'+sv(meta.regle_texte)+'</p></div>':'')+
    (meta.inversion?'<div class="tb-n"><h5>'+(meta.kind==='filtre'?'Ce qui périmerait cette liste':'Ce qui invaliderait cette thèse')+'</h5>'+blocs(meta.inversion)+'</div>':'')+
    (meta.biais?'<div class="tb-n"><h5>Biais de ce thème</h5>'+blocs(meta.biais)+'</div>':'')+
    '</div></details>';
}

/* Zone de données chiffrées (jauges + décomposition + rangée de métriques).
   Isolée dans #dzone parce qu'elle peut être RE-RENDUE seule : une fiche
   compacte est promue au niveau top 30 quand charts/<TICKER>.json livre le
breakdown complet, on remplace alors cette zone sans toucher au résumé
   (l'animation de frappe repartirait de zéro) ni au graphique. */
function dataZone(s,b){
  const bl=(b.note&&b.note.blocs)||{};
  const _p=k=>bl[k]?bl[k].pts:null;
  /* ÉLAGAGE DU 07/08 (« supprime tout ce qui n'est pas vital »). Sont partis :
     · les jauges « Signaux de marché » — le RSI ne note plus rien depuis la
       v4, et le z-score est déjà écrit en toutes lettres sous le graphique de
       cours, à côté de la décote dont il est le jumeau ; le RSI l'y rejoint.
     · la tuile Cross — copie du badge d'état affiché en tête de fiche.
     · la tuile Pente MM21 — micro-technique qui n'alimente ni la note ni
       aucune phrase de la page.
     · AUCUNE tuile de PER — ni courant, ni prévisionnel : les deux vivent sur
       la courbe des PER (le losange ambre au milieu de son historique dit
       s'il est cher, un chiffre nu dans une tuile ne dit rien) ; les pertes
       attendues, seul cas sans point, sont écrites sous la courbe.
     Restent quatre tuiles : où en est le cours (Draw 52s), et les trois
     fondamentaux frais que la note lisse sur plusieurs exercices. */
  /* LA RANGÉE DE QUATRE TUILES A ÉTÉ DISPERSÉE (07/08, « elles se baladent un
     peu toutes seules »). Elles étaient le reliquat d'un bandeau qui en
     comptait six et n'avaient plus de voisin qui les explique. Chacune est
     partie là où elle a un contexte : le repli 52 semaines sous le graphique
     de cours, les trois fondamentaux frais sous le graphique des chiffres
     publiés, avec la date de référence qui les accompagnait. Un nombre se lit
     à côté de ce qui le produit. */
  return '<div class="hd-note"><div class="hd-nh">Décomposition</div>'+
      meterN('Qualité',_p('q'),35)+meterN('Croissance',_p('c'),25)+meterN('Valorisation',_p('v'),25)+meterN('Momentum',_p('m'),15)+'</div>';
  /* PLUS DE DÉPLIANT « DÉTAIL DE LA NOTE » (décision du propriétaire, 07/08).
     Il listait les quinze critères phrasés un à un, sous les quatre jauges qui
     disent déjà où la note se gagne et se perd. Le raisonnement complet reste
     public — la grille est décrite au lexique, et le code qui la calcule est
     ouvert — mais la fiche n'a pas à le dérouler pour être lue. */
}

function render(s){const b=s.breakdown||{},a=A[s.ticker],doc=document.getElementById('doc');
  const compact=!!s._c&&!s._up, hasEd=!!(a&&(a.resume||a.biz||a.futur||a.actu||a.bull||a.bear));
  const score=s.score==null?0:s.score;
  const C=2*Math.PI*52,off=C*(1-score/100);
  const resumeBody=a&&a.resume?a.resume.map(p=>'<p class="resume">'+sv(p)+'</p>').join('')
:compact?'<p class="resume">'+sv(s.name)+', note '+score+'/100'+(function(){
      const bl=(b.note&&b.note.blocs)||{};
      const parts=[['q','qualité',35],['c','croissance',25],['v','valorisation',25],['m','momentum',15]]
        .filter(x=>bl[x[0]]&&bl[x[0]].pts!=null)
        .map(x=>x[1]+' '+String(bl[x[0]].pts).replace('.',',')+'/'+x[2]);
      return parts.length?' : '+parts.join(', '):'';
    })()+'. '+stateTag(b)+', RSI '+f(b.rsi,0)+', z-score '+fs(b.regression_z,1).replace('.',',')+'σ sur '+(b.regression_window_years||'?')+' ans.</p>'
:'<p class="resume">'+sv(s.name)+', score '+score+'/100. '+stateTag(b)+'. Croissance CA '+fs(b.rev_growth_pct,0)+' % (dern. trim., a/a), marge nette '+f(b.net_margin_pct,0)+' % (TTM), z-score '+fs(b.regression_z,1).replace('.',',')+'σ.</p><p class="resume stub">Synthèse qualitative à générer.</p>';
  const bb=(a&&(a.bull||a.bear))?'<div class="bullbear"><div class="bb bb-bull"><div class="bb-h">▲ Thèse haussière</div>'+bblist(a.bull)+'</div><div class="bb bb-bear"><div class="bb-h">▼ Thèse baissière</div>'+bblist(a.bear)+'</div></div>':'';
  // recouvrement des thèmes, visible depuis la fiche elle-même
  const tt=themesOf(s.ticker).map(id=>{const t=TBY[id];return t?'<a class="ttag" href="'+hashOf(id)+'">'+sv(t.label)+'</a>':'';}).join('');
  // Trois cas, distingués par le niveau de fiche publié par le générateur.
  // Une fiche « thematique » n'a PAS de rubrique Actu par construction : aucune
  // source datée n'est collectée pour ces titres. Afficher « À générer » y
// serait un mensonge, cette rubrique ne viendra jamais.
  // La rubrique Actu suit la DONNÉE, plus le niveau : une fiche thématique qui a
  // trouvé des sources l'affiche comme n'importe quelle autre.
  const brief=(a&&a._niveau==='thematique'), hasActu=!!(a&&a.actu&&a.actu.length);
  const prose=!hasEd?'<div class="prose">'+liteNote()+'</div>'
    :'<div class="prose"><div>'+sec('Business &amp; Moat',a&&a.biz?paras(a.biz):'<p class="stub">À générer.</p>')+'</div><div>'+sec('Perspectives',a&&a.futur?paras(a.futur):'<p class="stub">À générer.</p>')+'</div>'+
      ((brief&&!hasActu)?'':'<div>'+sec('Actu',(hasActu?paras(a.actu):'<p class="stub">À générer.</p>'))+'</div>')+'</div>';
  doc.classList.remove('on');
  doc.innerHTML=(curWl?'<div class="wl-crumb"><a href="#/">← Watchlists</a><span class="sepc">/</span><span class="crumb-cur">'+sv(curWl.label)+'</span></div>'+themeBar(curWl):'')+
    illuSociete(s.ticker)+
    '<div class="d-head"><div><div class="d-tk">'+sv(s.ticker)+'</div><div class="d-nm">'+sv(b.nom_complet||s.name)+' · '+sv(s.sector)+'</div><div class="d-tagrow"><span class="d-tag">'+stateTag(b)+'</span><span class="d-reg">'+region(s)+'</span>'+movTag(s)+'</div>'+(tt?'<div class="d-themes">'+tt+'</div>':'')+'</div>'+
    /* LA DÉCOMPOSITION EST DANS L'EN-TÊTE, entre l'identité et l'anneau
       (décision du propriétaire, 07/08, croquis à l'appui). C'est sa place
       logique : elle est la ventilation du nombre affiché juste à sa droite,
       et les deux se lisent maintenant d'un seul regard, avant même le
       résumé. */
    '<div id="dzone">'+dataZone(s,b)+'</div>'+
    '<div class="ring"><svg width="138" height="138"><circle cx="69" cy="69" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="69" cy="69" r="52" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1s ease" id="arc"/></svg><div class="rv"><div class="rl">SCORE</div><div class="rn" id="cu">0</div>'+(function(){const p=paliers(score);return p?'<div class="rp rp-'+p.ton+'">'+p.mot+'</div>':'';})()+'</div></div></div>'+
    '<div class="sep"></div><div id="rzone"></div>'+
    /* Les métriques des fiches COMPACTES restent dans le corps : leur
       bandeau de six tuiles n'a pas sa place dans l'en-tête, et la
       promotion au niveau top 30 le vide (le corps de la fiche prend
       alors le relais avec ses propres blocs). */
    '<div id="czone">'+(compact?compactMetrics(s):'')+'</div>'+
    '<div id="chartsec"></div>'+
    '<div id="fondasec"></div>'+
    prose+
    (bb?sec('Bull vs Bear',bb,'bbsec'):'');
  requestAnimationFrame(()=>{doc.classList.add('on');const rz=document.getElementById('rzone');if(rz){reduce?(rz.innerHTML=resumeBody):typeHTML(rz,resumeBody);}buildChart(s);const arc=document.getElementById('arc');if(arc)arc.style.strokeDashoffset=off;doc.querySelectorAll('.f').forEach(el=>el.style.width=el.dataset.w+'%');const cu=document.getElementById('cu');const _ct=performance.now();(function up(){const e=Math.min(1,(performance.now()-_ct)/600);if(cu)cu.textContent=Math.round(e*score);if(e<1)requestAnimationFrame(up);})();});
}
</script>
</body>
</html>
