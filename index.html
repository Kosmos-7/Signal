<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Terminal d'analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signal.css">
<style>
  /* ── index (terminal watchlist) : mise en page propre à la page ── */
  body{overflow:hidden}

  /* RAIL : nom complet + région + secteur */
  .rail{position:fixed;left:1.4rem;top:4.5rem;bottom:1.4rem;z-index:6;width:232px;display:flex;flex-direction:column}
  .rail-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 .4rem .5rem}
  .rail-back{font:600 .58rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;white-space:nowrap}
  .rail-back:hover{color:var(--ac)}
  .rail-top #rw{font:.58rem var(--mono);color:var(--text3);letter-spacing:.5px}
  .rail-h{display:flex;justify-content:space-between;gap:8px;font:600 .62rem var(--mono);letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;padding:0 .4rem .6rem;border-bottom:1px solid var(--line)}
  /* Le nom de la watchlist s'affiche en entier, quitte à passer sur deux
     lignes — « INFRASTRUCTURE DE L'… » tronqué ne nomme rien. */
  .rail-h #rc{color:var(--text2);line-height:1.45;overflow-wrap:break-word;min-width:0}
  .rail-h #rn{flex:0 0 auto}
  .rail-l{overflow-y:auto;flex:1;mask-image:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}.rail-l::-webkit-scrollbar{width:0}
  .rail-lex{display:block;margin-top:.4rem;padding:.65rem .4rem .1rem;border-top:1px solid var(--line);font:600 .6rem var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;cursor:pointer;flex:0 0 auto}
  .rail-lex::before{content:'§ '}
  .rail-lex:hover,.rail-lex.active{color:var(--ac)}
  .lexg{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.8rem;margin-top:.5rem}
  .lext{font:700 .8rem var(--mono);color:var(--ac);letter-spacing:.3px;margin-bottom:.3rem}
  .lexd{font-size:.92rem;color:var(--text2);line-height:1.6}
  .lexd em{font-style:normal;color:var(--text)}
  @media(max-width:900px){.lexg{grid-template-columns:1fr}}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:.5rem .4rem;cursor:pointer;border-bottom:1px solid var(--line);transition:padding-left .18s,border-color .18s}
  .row:hover,.row.sel{padding-left:.7rem}.row.sel{border-left:2px solid var(--ac);margin-left:-2px;padding-left:calc(.7rem - 2px)}
  .row .nm{font:500 .82rem var(--serif);line-height:1.2;color:var(--text2)}.row:hover .nm,.row.sel .nm{color:#fff}
  .rl-meta{display:flex;align-items:center;gap:6px;margin-top:4px}
  .reg{font:600 .52rem var(--mono);letter-spacing:.5px;color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:1px 4px}
  .sct{font:.58rem var(--mono);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .row .rr{text-align:right}.row .sc{font:500 .95rem var(--serif);color:var(--text)}.row .xx{font:.55rem var(--mono);color:var(--text3);letter-spacing:.5px;margin-top:1px}

  /* STAGE : analyse élargie */
  .stage{position:fixed;left:262px;right:1.4rem;top:4.6rem;bottom:1.4rem;z-index:5;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
  footer{width:100%;max-width:1060px;margin-top:.5rem;padding:1.4rem 1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1.2rem;flex-wrap:wrap}
  footer .footer-legal{font-size:.75rem;color:var(--text3);line-height:1.5;max-width:560px}
  footer .footer-right{font:.75rem var(--mono);color:var(--text3);white-space:nowrap}
  @media(max-width:900px){footer{flex-direction:column;align-items:flex-start;gap:.5rem;padding:1.25rem 1rem}}
  .stage::-webkit-scrollbar{width:5px}.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  .doc{width:100%;max-width:1060px;padding:.5rem 1.5rem 2.5rem;opacity:0;transition:opacity .35s}.doc.on{opacity:1}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
  .d-tk{font-family:var(--serif);font-size:3.4rem;line-height:.95;letter-spacing:-1px}
  .d-nm{font-size:.98rem;color:var(--text2);margin-top:.25rem}
  .d-tagrow{display:flex;align-items:center;gap:10px;margin-top:.85rem}
  .d-tag{font:600 .62rem var(--mono);letter-spacing:1.5px;text-transform:uppercase;padding:4px 11px;border:1px solid var(--line);color:var(--text2);border-radius:4px}
  .d-reg{font:600 .6rem var(--mono);letter-spacing:1px;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:4px 9px}

  .resume{font-size:1.04rem;line-height:1.75;color:var(--text);font-weight:400;max-width:1040px}.resume + .resume{margin-top:.75rem}

  .quant{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin:1.8rem 0}
  .qh{font:600 .6rem var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--ac);margin-bottom:.7rem;display:flex;align-items:center;gap:10px}.qh::after{content:'';flex:1;height:1px;background:var(--line)}
  .meter{grid-template-columns:104px 1fr 44px}   /* labels en toutes lettres */

  .prose{margin-top:1.8rem;max-width:1040px}
  .metrics-note{font:.62rem var(--mono);color:var(--text3);letter-spacing:.2px;line-height:1.55;margin:-.7rem 0 0}

  .bbsec{margin-top:1.9rem}
  .bbsec .sec-h{color:var(--text2)}

  /* apparition échelonnée des sections (futuriste) */
  .doc.on .resume,.doc.on .quant,.doc.on .metrics,.doc.on .prose,.doc.on .bbsec,.doc.on #chartsec{animation:rise .5s ease both}
  .doc.on #chartsec{animation-delay:.03s}
  .doc.on .quant{animation-delay:.05s}.doc.on .metrics{animation-delay:.1s}.doc.on .prose{animation-delay:.15s}.doc.on .bbsec{animation-delay:.2s}

  /* ── graphique de fiche : canal de régression (composant chx, porté de la maquette) ── */
  #chartsec:not(:empty){margin:1.7rem 0 .3rem}
  .chx-wrap{position:relative}
  .chx-svg{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
  .chx-axis{font-family:var(--mono);font-size:10px;fill:var(--text3)}
  .chx-blabel{font-family:var(--mono);font-size:9px;fill:var(--text3);opacity:.75}
  .chx-tip{position:absolute;pointer-events:none;background:#14141f;border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-family:var(--mono);font-size:11px;color:var(--text3);display:none;white-space:nowrap;line-height:1.7;z-index:3}
  .chx-tip .d{color:var(--text2)}.chx-tip .c{color:var(--ac);font-weight:700}.chx-tip .t{color:var(--text2);font-weight:700}
  .chx-ctrl{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
  .chx-pbtn{font-family:var(--mono);font-size:.72rem;letter-spacing:1px;color:var(--text3);background:none;border:1px solid var(--line);border-radius:5px;padding:3px 12px;cursor:pointer}
  .chx-pbtn.on{color:var(--ac);border-color:rgba(116,182,223,.5);background:rgba(116,182,223,.08)}
  .chx-pbtn:hover{border-color:rgba(116,182,223,.35)}
  .chx-rlbl{font-family:var(--mono);font-size:.74rem;color:var(--text2);margin-left:auto}
  .chx-legend{font-family:var(--mono);font-size:.72rem;color:var(--text3);margin:2px 0 6px;letter-spacing:.3px}
  .chx-load{font:.72rem var(--mono);color:var(--text3);letter-spacing:.6px;padding:2.2rem 0;text-align:center;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.012)}
  .chx-band{display:inline-block;width:14px;height:9px;background:rgba(116,182,223,.10);border:1px solid rgba(116,182,223,.25);border-radius:2px;vertical-align:-1px}
  .chx-slider{position:relative;height:34px;margin:6px 6px 0}
  .chx-slider .chx-track{position:absolute;left:0;right:0;top:15px;height:4px;background:rgba(255,255,255,.08);border-radius:2px}
  .chx-slider .chx-sel{position:absolute;top:15px;height:4px;background:rgba(116,182,223,.45);border-radius:2px}
  .chx-slider input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:34px;background:none;-webkit-appearance:none;appearance:none;pointer-events:none;margin:0}
  .chx-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#0d0d16;border:2px solid var(--ac);cursor:grab}
  .chx-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#0d0d16;border:2px solid var(--ac);cursor:grab}
  .chx-mrow{font:.84rem var(--mono);color:var(--text2);margin-top:.9rem;letter-spacing:.2px}
  .chx-mrow .chx-k{color:var(--text3)}
  .chx-mrow .chx-v{font-weight:700;color:var(--ac)}
  .chx-mrow .chx-v2{font-weight:700;color:var(--text)}
  
  .chx-warn{display:flex;gap:10px;align-items:flex-start;background:rgba(232,168,32,.06);border:1px solid rgba(232,168,32,.28);border-radius:8px;padding:10px 14px;margin:12px 0 0;font-size:.8rem;color:var(--text2);line-height:1.55}
  .chx-warn .chx-ic{flex:none;color:var(--gold);font-size:.95rem;margin-top:1px}
  .chx-warn b{color:var(--text)}
  .chx-note{font-size:.72rem;color:var(--text3);margin-top:.6rem;line-height:1.55}
  @media(max-width:900px){
    /* tactile : poignées du double curseur ≥ 20px */
    .chx-slider{height:44px}
    .chx-slider input[type=range]{height:44px}
    .chx-slider .chx-track,.chx-slider .chx-sel{top:20px}
    .chx-slider input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
    .chx-slider input[type=range]::-moz-range-thumb{width:20px;height:20px}
  }

  /* ══ HOMEPAGE DES WATCHLISTS (vue #/) ══════════════════════════════════
     Le rail n'a pas de contexte sur la homepage : il disparaît et la scène
     récupère toute la largeur. Aucune couleur nouvelle — les thèmes se
     distinguent par la typo (.tag mono capitales) et le trait, jamais par
     une teinte propre. */
  body.v-home .rail{display:none}
  body.v-home .stage{left:1.4rem}
  body.v-home .doc{max-width:1180px}

  .home-h{padding:.4rem 0 0}
  .home-t{font-family:var(--serif);font-size:2.7rem;line-height:1;letter-spacing:-1.2px}
  .home-lead{font-size:1rem;color:var(--text2);line-height:1.7;margin-top:.7rem;max-width:660px}
  .home-meta{font:.66rem var(--mono);color:var(--text3);letter-spacing:.6px;margin-top:.9rem;text-transform:uppercase}
  .home-meta b{color:var(--text2);font-weight:600}

  /* Une carte par ligne : à quatre par ligne, le texte devenait illisible et
     l'œil se perdait. On préfère scroller sur des cartes larges et respirées. */
  .tgrid{display:flex;flex-direction:column;gap:.85rem;margin:1.6rem 0 .4rem}
  .tcard{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);overflow:hidden;text-decoration:none;color:inherit;transition:border-color .2s,background .2s,transform .2s}
  .tcard:hover,.tcard:focus-visible{border-color:rgba(116,182,223,.42);background:rgba(255,255,255,.04);transform:translateY(-2px);outline:none}
  .tc-img{position:relative;flex:0 0 auto;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    background:linear-gradient(140deg,rgba(116,182,223,.14),rgba(116,182,223,.03) 55%,rgba(255,255,255,.015))}
  .tc-img::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px)}
  .tc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
  .tc-fb{position:relative;font:600 .6rem var(--mono);letter-spacing:2.4px;text-transform:uppercase;color:var(--text3);text-align:center;line-height:1.9;padding:0 14px;max-width:100%;overflow-wrap:anywhere}
  .tc-b{display:flex;flex-direction:column;flex:1;padding:.9rem 1rem 1rem;gap:.5rem}
  .tc-kind{font:600 .55rem var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:2px 7px;align-self:flex-start}
  .tc-l{font-family:var(--serif);font-size:1.22rem;line-height:1.15;letter-spacing:-.3px;color:var(--text)}
  .tc-s{font:.64rem var(--mono);color:var(--text3);letter-spacing:.4px;margin-top:-.28rem}
  /* La thèse s'affiche EN ENTIER sur la carte — elle est le contenu, pas un
     teaser. Les cartes ont des hauteurs différentes, et c'est très bien. */
  .tc-th{font-size:.855rem;line-height:1.55;color:var(--text2)}
  .tc-top{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:.35rem}
  .tc-chip{font:.62rem var(--mono);color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:2px 6px;letter-spacing:.3px;white-space:nowrap}
  .tc-chip b{color:var(--text2);font-weight:700;margin-left:5px}
  .tc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font:.6rem var(--mono);color:var(--text3);letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--line);padding-top:.55rem}
  .tc-go{color:var(--text3);transition:color .2s}.tcard:hover .tc-go{color:var(--ac)}

  /* Toutes les cartes adoptent la mise en page horizontale : image à gauche,
     texte à droite. La principale garde son accent et un peu plus d'ampleur. */
  .tcard{flex-direction:row}
  .tc-img{aspect-ratio:auto;width:31%;max-width:340px;min-height:158px;border-bottom:0;border-right:1px solid var(--line)}
  .tc-b{padding:1.05rem 1.3rem 1.1rem;gap:.55rem}
  .tc-th{max-width:760px}
  /* La watchlist principale n'a plus ni taille ni traitement particuliers :
     toutes les cartes sont strictement identiques. Elle reste identifiable par
     son contenu — son intitulé et son étiquette PRINCIPALE — plutôt que par un
     habillage qui la ferait passer pour une catégorie à part. */

  /* bandeau de thème au-dessus de la fiche (remplace la vue liste supprimée) */
  .tbar{border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.018);margin:.1rem 0 1.1rem}
  .tbar>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:.5rem .8rem;cursor:pointer;list-style:none}
  .tbar>summary::-webkit-details-marker{display:none}
  .tbar>summary:hover{background:rgba(255,255,255,.025)}
  .tb-k{font:600 .53rem var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
  .tb-l{font-family:var(--serif);font-size:1rem;color:var(--text)}
  .tb-c{font:.62rem var(--mono);color:var(--text3);letter-spacing:.4px}
  .tb-deg{font:600 .53rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-left:2px solid var(--text3);border-radius:3px;padding:2px 6px}
  .tb-x{margin-left:auto;font:.62rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);transition:color .15s}
  .tbar>summary:hover .tb-x{color:var(--ac)}
  .tbar[open] .tb-x{color:var(--ac)}
  .tbar[open] .tb-x::after{content:' (replier)';letter-spacing:.4px;text-transform:none}
  .tb-body{padding:0 .85rem .85rem;border-top:1px solid var(--line);margin-top:.1rem;padding-top:.7rem}
  .tb-body>p{font-size:.88rem;line-height:1.65;color:var(--text2);margin:0 0 .7rem}
  .tb-n{border-left:2px solid var(--line);padding-left:.7rem;margin-top:.6rem}
  .tb-n h5{font:600 .55rem var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin:0 0 .25rem}
  .tb-n p{font-size:.82rem;line-height:1.6;color:var(--text2);margin:0}
  .crumb-cur{color:var(--text2)}

  /* bandeau de couverture partielle — neutre : trait + capitales mono, pas de teinte */
  .cov-warn{border:1px solid var(--line);border-left:2px solid var(--text3);background:rgba(255,255,255,.03);border-radius:5px;padding:.5rem .7rem;font-size:.76rem;line-height:1.5;color:var(--text2)}
  .cov-warn b{display:block;font:600 .55rem var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin-bottom:2px}

  /* ══ VUE D'UNE WATCHLIST (#/w/<id>) ═══════════════════════════════════ */
  .wl-crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:.9rem}
  .wl-crumb a{font:600 .58rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);text-decoration:none}
  .wl-crumb a:hover{color:var(--ac)}
  .wl-crumb .sepc{color:var(--text3);opacity:.5}
  .wl-t{font-family:var(--serif);font-size:2.5rem;line-height:1.02;letter-spacing:-1px}
  .wl-s{font:.7rem var(--mono);color:var(--text3);letter-spacing:.6px;margin-top:.45rem;text-transform:uppercase}
  .wl-th{font-size:1.02rem;line-height:1.75;color:var(--text);margin-top:1.1rem;max-width:900px}
  .wl-rule{margin-top:1rem;border:1px solid var(--line);border-left:2px solid var(--ac);border-radius:5px;padding:.6rem .85rem;font:.78rem var(--mono);color:var(--text2);line-height:1.55;max-width:900px}
  .wl-rule i{display:block;font:600 .55rem var(--mono);font-style:normal;letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
  .wl-notes{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem;max-width:900px}
  .wl-note{border:1px solid var(--line);border-radius:8px;padding:.8rem .95rem;background:rgba(255,255,255,.018)}
  .wl-note h4{font:600 .56rem var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem;font-family:var(--mono)}
  .wl-note p{font-size:.855rem;line-height:1.62;color:var(--text2)}
  .wl-cov{font:.64rem var(--mono);color:var(--text3);letter-spacing:.5px;margin-top:1rem;text-transform:uppercase}
  .wl-covw{margin-top:.9rem;max-width:900px}

  /* liste large : même grammaire que .row du rail, enrichie des tags de thèmes */
  .wl-listh{display:flex;justify-content:space-between;align-items:center;font:600 .58rem var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin:1.9rem 0 .2rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
  .wrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:.62rem .4rem;cursor:pointer;border-bottom:1px solid var(--line);transition:padding-left .18s,border-color .18s,background .18s}
  .wrow:hover,.wrow.sel{padding-left:.7rem;background:rgba(255,255,255,.02)}
  .wrow.sel{border-left:2px solid var(--ac);margin-left:-2px;padding-left:calc(.7rem - 2px)}
  .wr-n{font:.66rem var(--mono);color:var(--text3);letter-spacing:.5px}
  .wr-nm{font:500 .96rem var(--serif);line-height:1.2;color:var(--text2)}
  .wrow:hover .wr-nm,.wrow.sel .wr-nm{color:#fff}
  .wr-tk{font:.62rem var(--mono);color:var(--text3);letter-spacing:.6px;margin-left:7px}
  .wr-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .ttag{font:600 .54rem var(--mono);letter-spacing:1.1px;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:1px 6px;text-decoration:none;transition:color .15s,border-color .15s;white-space:nowrap}
  .ttag:hover{color:var(--ac);border-color:rgba(116,182,223,.45)}
  .wr-r{text-align:right}
  .wr-r .sc{font:500 1.02rem var(--serif);color:var(--text)}
  .wr-r .xx{font:.55rem var(--mono);color:var(--text3);letter-spacing:.5px;margin-top:1px;white-space:nowrap}
  .wl-empty{padding:2rem .4rem;color:var(--text3);font-size:.9rem}

  /* ── fiche d'un titre sans analyse éditoriale (hors watchlist principale) ── */
  .lite-note{border:1px solid var(--line);border-left:2px solid var(--ac);border-radius:8px;padding:1rem 1.2rem;background:rgba(255,255,255,.02);max-width:900px}
  .lite-note h4{font:600 .58rem var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem;font-family:var(--mono)}
  .lite-note p{font-size:.93rem;line-height:1.7;color:var(--text2)}.lite-note p+p{margin-top:.5rem}
  .lite-note a{color:var(--ac);text-decoration:none}
  .d-themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:.75rem}

  /* repli mobile : rail + stage repassent en flux vertical */
  @media(max-width:900px){
    body.v-home .stage{left:auto}
    .home-t{font-size:2.05rem}
    .tgrid{gap:.85rem;margin-top:1.3rem}
    /* sous 900 px la mise en page horizontale ne tient plus : image au-dessus */
    .tcard{flex-direction:column}
    .tc-img{width:auto;max-width:none;aspect-ratio:16/9;min-height:0;border-right:0;border-bottom:1px solid var(--line)}
    .tc-b{padding:1rem 1.05rem 1.1rem}
    .wl-t{font-size:1.9rem}
    body.v-index .rail{display:none}          /* la liste large fait déjà le travail */
    body.v-index .stage{margin-top:4.6rem}
    .wl-notes{grid-template-columns:1fr;gap:.7rem}
    .wrow{grid-template-columns:24px 1fr auto;gap:9px}
    .wl-th{font-size:.95rem}
  }
  @media(max-width:900px){
    body{overflow:auto}
    /* position:relative et NON static : le rail et la scène doivent conserver
       leur z-index, sinon leur contenu non positionné repasse SOUS le calque
       de fond #fx (z-index:0) et devient invisible — c'était déjà le cas du
       titre de fiche en mobile avant la homepage. */
    .rail{position:relative;left:auto;top:auto;bottom:auto;width:auto;margin:4.6rem 1rem 0}
    .rail-l{max-height:38vh}
    .stage{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:1rem 0 0;overflow:visible}
    .doc{scroll-margin-top:4.2rem}   /* le header fixe ne recouvre pas le haut de la fiche */
    body.v-home .stage{margin-top:4.6rem}
    .d-tk{font-size:2.6rem}
    .quant{grid-template-columns:1fr;gap:1rem}
  }
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header>
  <a class="brand" href="index.html"><span class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 14 L7 14 L9.5 8.5 L13.5 20.5 L16.5 5 L20 14 L24.5 14" stroke="#22d98a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-name">Signal</span></a>
  <nav><a href="index.html#/" class="active">Watchlists</a><a href="portfolio.html">Portefeuille IA</a><a href="apprendre.html">Apprendre</a></nav>
</header>

<div class="rail"><div class="rail-top"><a class="rail-back" href="#/">← Watchlists</a><span id="rw"></span></div><div class="rail-h"><span id="rc">—</span><span id="rn"></span></div><div class="rail-l" id="rl"></div><a class="rail-lex" id="lexlink" href="#lexique">Lexique des signaux</a></div>
<div class="stage"><div class="doc" id="doc"></div><footer><div class="footer-legal">Signal est un service éditorial d'information financière. Contenu fourni à titre informatif uniquement. Ne constitue pas un conseil en investissement au sens AMF.</div><div class="footer-right">Bêta</div></footer></div>

<script src="signal-fx.js"></script>
<script>
const A={};
const f=(v,d=1)=>v==null?'—':(+v).toFixed(d),fs=(v,d=1)=>v==null?'—':(v>0?'+':'')+(+v).toFixed(d);
let stocks=[],sel=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Payload graphique : un fichier par titre, chargé à l'ouverture de sa fiche.
   Avant, charts.json monolithique était téléchargé au premier rendu — 561 Ko
   bloquants pour 30 titres, et près de 3,5 Mo une fois les 190 titres
   thématiques inclus. À la demande, c'est 19 Ko par fiche ouverte.
   CH sert de cache mémoire ; une entrée `null` mémorise une absence (404 ou
   fichier illisible) pour ne pas re-tenter à chaque ouverture. */
const CH={}, CHP={};
function loadChart(tk){
  if(tk in CH)return Promise.resolve(CH[tk]);
  if(CHP[tk])return CHP[tk];
  // Le ticker est déjà restreint à [A-Z0-9.-] côté screener ; encodeURIComponent
  // couvre malgré tout le cas d'un ticker inattendu dans un chemin d'URL.
  return CHP[tk]=fetch('charts/'+encodeURIComponent(tk)+'.json?v='+CHV)
    .then(r=>r.ok?r.json():null).catch(()=>null)
    .then(d=>{CH[tk]=d;delete CHP[tk];return d;});
}
// Version de cache : la date du jour suffit, les données bougent au plus une
// fois par jour ouvré. Évite un paramètre unique par requête, qui interdirait
// toute mise en cache navigateur des ~190 fichiers.
const CHV=new Date().toISOString().slice(0,10);

/* ── universe.json : homepage des watchlists + vues thématiques ──────────────
   Contrat : {updated_at, week, universe_declared, universe_scored,
              themes:[{id,label,sous_titre,kind,thesis,inversion,biais,regle_texte,
                       declares,scores,couverture,status,members:[TICKER…]}],
              stocks:{TICKER:{nom,score,secteur,market,devise,prix,z,fenetre,
                              decote_pct,rsi,cross,cross_j,upside_pct,analystes,
                              qualite,valorisation,timing,themes:[id…],top30}}}
   Le fichier est OPTIONNEL : s'il manque, la page se replie sur la seule
   watchlist principale (watchlist.json) sans rien casser. */
const U={themes:[],stocks:{},week:'',updated_at:'',universe_declared:null,universe_scored:null};
const TBY={};              // id de thème → méta
const WL={};               // ticker → fiche complète (top 30, watchlist.json)
const MAIN='principale';   // id réservé de la watchlist principale
let curWl=null,curList=[];

// Descripteur de repli de la watchlist principale — universe.json peut le
// fournir sous l'id « principale » ; sinon on l'écrit ici, factuellement.
function mainMeta(){
  if(TBY[MAIN])return TBY[MAIN];
  return {id:MAIN,label:'Watchlist principale',sous_titre:'Les meilleurs scores, toutes catégories',kind:'principale',
    thesis:"Les trente meilleurs scores de l'univers, toutes catégories confondues. Une seule méthode : la qualité du business, le prix payé, le timing. C'est le classement de référence — les watchlists thématiques n'en sont que des projections, un titre n'est jamais noté deux fois.",
    inversion:'',biais:'',regle_texte:'',declares:stocks.length,scores:stocks.length,
    couverture:1,status:'ok',members:stocks.map(s=>s.ticker)};
}
const KIND={these:'Thèse',secteur:'Secteur',calcule:'Calculé',principale:'Principale'};

Promise.all([
  fetch('watchlist.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('watchlist.json HTTP '+r.status);return r.json();}),
  fetch('analyses.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch('universe.json?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([wl,an,un])=>{
  Object.assign(A, an||{});
  stocks=(wl.stocks||[]).slice().sort((a,b)=>b.score-a.score);
  stocks.forEach(s=>{WL[s.ticker]=s;});
  if(un&&typeof un==='object'){
    U.themes=Array.isArray(un.themes)?un.themes:[];
    U.stocks=(un.stocks&&typeof un.stocks==='object')?un.stocks:{};
    U.week=un.week||'';U.updated_at=un.updated_at||'';
    U.universe_declared=un.universe_declared;U.universe_scored=un.universe_scored;
    U.themes.forEach(t=>{if(t&&t.id)TBY[t.id]=t;});
  }
  document.getElementById('rw').textContent=((U.week||wl.week||'')).replace('Sem. ','S');
  document.getElementById('lexlink').addEventListener('click',e=>{e.preventDefault();nav('#lexique');});
  window.addEventListener('hashchange',route);
  route();
}).catch(err=>{
  // Durcissement post-incident NaN (CHANGELOG 3.0.1) : un JSON corrompu ou un 404
  // laissait la page définitivement vide, sans message. On affiche l'échec.
  console.error(err);
  const msg='<div style="padding:24px 16px;opacity:.7;font-size:.85rem;line-height:1.5">Données momentanément indisponibles.<br>Rechargez la page dans quelques minutes.</div>';
  const l=document.getElementById('rl');if(l)l.innerHTML=msg;
  const d=document.getElementById('doc');if(d){d.innerHTML=msg;d.classList.add('on');}
});

/* ══ ROUTEUR PAR HASH ═══════════════════════════════════════════════════════
   #/                      homepage des watchlists (défaut, hash vide inclus)
   #/w/<id>                une watchlist (id = « principale » ou id de thème)
   #/w/<id>/<TICKER>       fiche d'un titre dans le contexte de sa watchlist
   #lexique                lexique — FORME NUE HISTORIQUE, cible du seul lien
                           profond entrant du site (portfolio.html). Jamais
                           réécrite en « #/lexique » : aucun alias n'est émis. */
function parseHash(){
  const h=location.hash||'';
  if(h==='#lexique')return {v:'lex'};
  const m=h.match(/^#\/w\/([A-Za-z0-9_-]+)(?:\/([^\/?#]+))?\/?$/);
  if(m)return {v:'w',id:m[1],tk:m[2]?decodeURIComponent(m[2]).toUpperCase():null};
  return {v:'home'};
}
function nav(h){ if(location.hash===h)route(); else location.hash=h; }
// La nav du header est écrite à la main dans les 3 pages ; dans index.html les
// deux entrées pointent sur cette même page, .active suit donc la route.
// Le header n'a plus qu'une entrée pour cette page : « Watchlists » reste
// active sur toutes ses routes (homepage, thème, fiche, lexique).
function navActive(){
  document.querySelectorAll('header nav a').forEach(a=>{
    if((a.getAttribute('href')||'')==='index.html#/')a.classList.add('active');
  });
}
function hashOf(id,tk){ return '#/w/'+id+(tk?'/'+encodeURIComponent(tk):''); }
function route(){
  const r=parseHash();navActive();
  if(r.v==='lex'){ if(!curWl)setWl(mainMeta()); document.body.classList.remove('v-home'); showLexique(); return; }
  if(r.v==='w'){ openWl(r.id,r.tk); return; }
  showHome();
}

function wlMeta(id){ return id===MAIN?mainMeta():(TBY[id]&&TBY[id].id!==MAIN?TBY[id]:null); }
function setWl(meta){
  curWl=meta;
  curList=(meta.id===MAIN)?stocks.slice():(meta.members||[]).map(stockOf).filter(Boolean);
  const rc=document.getElementById('rc'),rn=document.getElementById('rn');
  if(rc)rc.textContent=meta.label;
  if(rn)rn.textContent=curList.length+' val.';
  listBuild();
}
function openWl(id,tk){
  const meta=wlMeta(id);
  if(!meta){ nav('#/'); return; }                       // id inconnu → homepage
  document.body.classList.remove('v-home');
  if(!curWl||curWl.id!==meta.id)setWl(meta);
  const ll=document.getElementById('lexlink');if(ll)ll.classList.remove('active');
  // Ouvrir une watchlist affiche directement sa PREMIÈRE valeur, comme la
  // watchlist principale l'a toujours fait. Une vue liste intermédiaire
  // dupliquait exactement le rail de gauche — deux fois la même information
  // à l'écran, sans rien ajouter.
  const s=(tk?(curList.find(x=>x.ticker===tk)||stockOf(tk)):curList[0])||curList[0];
  if(!s){ nav('#/'); return; }             // watchlist vide (ne devrait pas arriver)
  if(tk&&s.ticker!==tk){ nav(hashOf(id,s.ticker)); return; }   // ticker inconnu → 1re valeur
  if(!tk){ history.replaceState(null,'',hashOf(id,s.ticker)); navActive(); }
  pick(s);
}

/* Un titre hors top 30 n'existe que sous forme compacte dans universe.json :
   on lui fabrique un objet de même forme que ceux de watchlist.json, avec un
   breakdown partiel. Tout ce qui manque vaut null et s'affiche « — ». */
const _lite={};
function stockOf(tk){
  if(WL[tk])return WL[tk];
  if(_lite[tk])return _lite[tk];
  const u=U.stocks[tk];if(!u)return null;
  const s={ticker:tk,name:u.nom||tk,sector:u.secteur||'',market:u.market||'',score:u.score,badge:null,_c:true,_u:u,
    breakdown:{qualite:u.qualite,valorisation:u.valorisation,timing:u.timing,
      rsi:u.rsi,regression_z:u.z,regression_window_years:u.fenetre,decote_pct:u.decote_pct,
      cross_type:u.cross||'',cross_days_ago:u.cross_j,
      target_upside_pct:u.upside_pct,target_analysts:u.analystes}};
  _lite[tk]=s;return s;
}
function uOf(s){ return (s&&U.stocks[s.ticker])||null; }
function themesOf(tk){ const u=U.stocks[tk];return (u&&Array.isArray(u.themes))?u.themes:[]; }

const REG={PA:'EU',DE:'EU',AS:'EU',BR:'EU',MI:'EU',MC:'EU',AT:'EU',HE:'EU',VI:'EU',LI:'EU',IS:'EU',
  L:'UK',SW:'CH',CO:'DK',ST:'SE',OL:'NO',T:'JP',KS:'KR',KQ:'KR',HK:'HK',TO:'CA',AX:'AU'};
function region(s){ if(s.badge)return s.badge; const p=(s.ticker||'').split('.'); return p.length>1?(REG[p[p.length-1].toUpperCase()]||'INT'):'US'; }

function listBuild(){const l=document.getElementById('rl');if(!l)return;l.innerHTML='';curList.forEach(s=>{const r=document.createElement('div');r.className='row';s._r=r;
  r.innerHTML='<div><div class="nm">'+sv(s.name)+'</div><div class="rl-meta"><span class="reg">'+region(s)+'</span><span class="sct">'+sv(s.sector||'')+'</span></div></div>'+
    '<span class="rr"><div class="sc">'+(s.score==null?'—':s.score)+'</div></span>';
  r.tabIndex=0;r.setAttribute('role','button');
  const goto=()=>nav(hashOf(curWl?curWl.id:MAIN,s.ticker));
  r.addEventListener('click',goto);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goto();}});l.appendChild(r);});}

/* ══ HOMEPAGE DES WATCHLISTS ════════════════════════════════════════════════ */
function themeImg(id,label){
  return '<div class="tc-img"><span class="tc-fb">'+sv(label||id)+'</span>'+
    '<img src="assets/themes/'+encodeURIComponent(id)+'.png" alt="" loading="lazy" onerror="this.remove()"></div>';
}
function topChips(meta){
  return (meta.members||[]).slice(0,3).map(tk=>{
    const u=U.stocks[tk]||(WL[tk]?{score:WL[tk].score}:null);
    return '<span class="tc-chip">'+sv(tk)+'<b>'+(u&&u.score!=null?u.score:'—')+'</b></span>';
  }).join('');
}
function covWarn(meta){
  if(meta.status!=='degraded')return '';
  return '<div class="cov-warn"><b>Couverture partielle</b>'+meta.scores+' titres scorés sur '+meta.declares+
    ' déclarés ('+Math.round((meta.couverture||0)*100)+' %). Les titres manquants ne sont pas notés zéro — ils sont absents de la vue.</div>';
}
function card(meta,main){
  const n=(meta.members||[]).length;
  return '<a class="tcard'+(main?' tc-main':'')+'" href="'+hashOf(meta.id)+'">'+
    themeImg(meta.id,meta.label)+
    '<div class="tc-b">'+
      '<span class="tc-kind">'+sv(KIND[meta.kind]||meta.kind||'')+'</span>'+
      '<div class="tc-l">'+sv(meta.label)+'</div>'+
      (meta.sous_titre?'<div class="tc-s">'+sv(meta.sous_titre)+'</div>':'')+
      '<p class="tc-th">'+sv(meta.thesis||'')+'</p>'+
      (meta.status==='degraded'?covWarn(meta):'')+
      '<div class="tc-top">'+topChips(meta)+'</div>'+
      '<div class="tc-f"><span>'+n+' titre'+(n>1?'s':'')+'</span><span class="tc-go">Ouvrir →</span></div>'+
    '</div></a>';
}
function showHome(){
  document.body.classList.add('v-home');document.body.classList.remove('v-index');
  curWl=null;sel=null;
  const ll=document.getElementById('lexlink');if(ll)ll.classList.remove('active');
  const doc=document.getElementById('doc');doc.classList.remove('on');
  const m=mainMeta();
  const others=U.themes.filter(t=>t&&t.id&&t.id!==MAIN);
  // Volontairement sobre : la date et la semaine situent la fraîcheur des
  // données, le décompte de titres scorés relevait du tableau de bord interne.
  const meta=[U.updated_at?'Mise à jour '+sv(U.updated_at):'',U.week?sv(U.week):''
  ].filter(Boolean).join(' · ');
  doc.innerHTML='<div class="home-h"><div class="home-t">Watchlists</div>'+
    '<p class="home-lead">La <b>watchlist principale</b> répond à une question : où sont les meilleurs dossiers cette semaine ? Trente titres, toutes catégories, sélectionnés par un score unique qui pèse la qualité du business, le prix payé et le timing.</p>'+
    '<p class="home-lead">Les <b>watchlists thématiques</b> répondent à une autre : si vous croyez à une thèse — l\'infrastructure de l\'IA, les métiers de la finance — quels titres l\'incarnent, et lesquels sont les mieux notés en ce moment ? Chaque thème expose sa thèse, ce qui l\'invaliderait et les biais qu\'il concentre, avec les mêmes scores que partout ailleurs. De quoi comparer des titres à l\'intérieur d\'une conviction, sans refaire la recherche titre par titre.</p>'+
    (meta?'<div class="home-meta">'+meta+'</div>':'')+'</div>'+
    '<div class="tgrid">'+card(m,true)+others.map(t=>card(t,false)).join('')+'</div>'+
    (others.length?'':'<p class="wl-empty">Les watchlists thématiques ne sont pas encore publiées.</p>');
  const st=document.querySelector('.stage');if(st)st.scrollTop=0;
  requestAnimationFrame(()=>doc.classList.add('on'));
}

/* ══ VUE D'UNE WATCHLIST ════════════════════════════════════════════════════ */
function wrow(s,i,wlid){
  const b=s.breakdown||{},z=b.regression_z;
  const tags=themesOf(s.ticker).filter(id=>id!==wlid).map(id=>{
    const t=TBY[id];return t?'<a class="ttag" href="'+hashOf(id)+'">'+sv(t.label)+'</a>':'';
  }).join('');
  return '<div class="wrow" data-tk="'+sv(s.ticker)+'" tabindex="0" role="button">'+
    '<span class="wr-n">'+String(i+1).padStart(2,'0')+'</span>'+
    '<div><div class="wr-nm">'+sv(s.name)+'<span class="wr-tk">'+sv(s.ticker)+'</span></div>'+
      '<div class="rl-meta"><span class="reg">'+region(s)+'</span><span class="sct">'+sv(s.sector||'')+'</span></div>'+
      (tags?'<div class="wr-tags">'+tags+'</div>':'')+
    '</div>'+
    '<div class="wr-r"><div class="sc">'+(s.score==null?'—':s.score)+'</div>'+
      '<div class="xx">'+(z==null?'—':'z '+fs(z,1).replace('.',',')+'σ')+'</div></div>'+
  '</div>';
}
function renderWl(meta){
  // v-index : la vue liste large se suffit à elle-même ; en mobile le rail
  // ferait doublon (deux fois la même liste, l'une au-dessus de l'autre).
  document.body.classList.add('v-index');
  const doc=document.getElementById('doc');doc.classList.remove('on');
  const isCalc=meta.kind==='calcule',isMain=meta.id===MAIN;
  doc.innerHTML='<div class="wl-crumb"><a href="#/">← Watchlists</a><span class="sepc">/</span><span class="tag">'+sv(KIND[meta.kind]||meta.kind||'')+'</span></div>'+
    '<div class="wl-t">'+sv(meta.label)+'</div>'+
    (meta.sous_titre?'<div class="wl-s">'+sv(meta.sous_titre)+'</div>':'')+
    (meta.thesis?'<p class="wl-th">'+sv(meta.thesis)+'</p>':'')+
    (isCalc&&meta.regle_texte?'<div class="wl-rule"><i>Règle de sélection, appliquée à chaque run</i>'+sv(meta.regle_texte)+'</div>':'')+
    ((meta.inversion||meta.biais)?'<div class="wl-notes">'+
      (meta.inversion?'<div class="wl-note"><h4>Ce qui invaliderait cette thèse</h4><p>'+sv(meta.inversion)+'</p></div>':'')+
      (meta.biais?'<div class="wl-note"><h4>Biais de ce thème</h4><p>'+sv(meta.biais)+'</p></div>':'')+
    '</div>':'')+
    (meta.status==='degraded'?'<div class="wl-covw">'+covWarn(meta)+'</div>':
      (meta.eligibles!=null?'<div class="wl-cov">'+meta.scores+' titres retenus sur '+meta.eligibles+' éligibles — la liste est bornée pour rester lisible, pas tronquée en silence</div>':
       meta.declares!=null&&!isMain?'<div class="wl-cov">'+meta.scores+' titres scorés sur '+meta.declares+' déclarés · couverture '+Math.round((meta.couverture||0)*100)+' %</div>':''))+
    '<div class="wl-listh"><span>'+curList.length+' titre'+(curList.length>1?'s':'')+(isCalc?' — triés par la règle':isMain?' — triés par score':' — meilleur score d\'abord')+'</span><span>Score</span></div>'+
    (curList.length?'<div id="wlist">'+curList.map((s,i)=>wrow(s,i,meta.id)).join('')+'</div>'
      :'<p class="wl-empty">Aucun titre scoré dans cette vue pour ce run.</p>');
  const host=document.getElementById('wlist');
  if(host)host.addEventListener('click',e=>{
    if(e.target.closest('.ttag'))return;                 // les tags de thèmes gardent leur lien
    const r=e.target.closest('.wrow');if(r)nav(hashOf(meta.id,r.dataset.tk));
  });
  if(host)host.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const r=e.target.closest('.wrow');if(!r||e.target.closest('.ttag'))return;
    e.preventDefault();nav(hashOf(meta.id,r.dataset.tk));
  });
  const st=document.querySelector('.stage');if(st)st.scrollTop=0;
  requestAnimationFrame(()=>doc.classList.add('on'));
}

function stateTag(b){const ct=b.cross_type==='golden'?'GOLDEN CROSS':b.cross_type==='death'?'DEATH CROSS':'CROSS NEUTRE';return ct+(b.cross_days_ago!=null?' · '+b.cross_days_ago+' J':'');}
// Échappe tout HTML sauf <b>…</b> (contrat éditorial). Double protection avec le
// sanitizer Python de generate_analyses.py : les fiches déjà publiées (non
// régénérées tant que _sig ne change pas) sont couvertes ici aussi.
function sv(s){s=String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');return s.replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}

/* ── Canal de régression (composant chx, porté de la maquette validée sur données réelles) ──
   Données : CH[ticker] = {points, mm21, mm200, t_win0, t_last} (t = mois flottant) + breakdown.
   Le canal est RE-FITTÉ sur la période affichée (exploration) ; les métriques décote/z de la
   fiche restent celles du screener (fenêtre officielle). Aucun symbole de devise (nombres bruts). */
function curSym(t){t=(t||'').toUpperCase();
  if(/\.(PA|DE|AS|BR|MI|MC|AT|HE|VI|LI|IS)$/.test(t))return' €';
  if(/\.L$/.test(t))return' £';
  if(/\.SW$/.test(t))return' CHF';
  if(/\.(CO|ST|OL)$/.test(t))return' kr';
  if(/\.T$/.test(t))return' ¥';
  return' $';}
/* Charge le payload du titre puis dessine. Le rendu est asynchrone : on garde
   le ticker demandé pour ignorer une réponse tardive si l'utilisateur a changé
   de fiche entre-temps (sinon le graphe d'un titre s'afficherait sur un autre). */
function buildChart(s){
  const host=document.getElementById('chartsec'); if(!host)return;
  const tk=s.ticker;
  if(!(tk in CH))host.innerHTML='<div class="chx-load">Chargement du graphique…</div>';
  loadChart(tk).then(d=>{ if(sel&&sel.ticker!==tk)return;
    // Le fichier charts/<TICKER>.json embarque le breakdown COMPLET du scoring
    // depuis le run d'août 2026. Pour un titre hors top 30 (breakdown compact
    // fabriqué depuis universe.json), on promeut la fiche au niveau du top 30
    // dès que le payload arrive : mêmes métriques, mêmes rubriques. Les anciens
    // fichiers sans breakdown laissent la fiche compacte — dégradation douce.
    if(d&&d.breakdown&&s._c&&!s._up){
      s._up=true; s.breakdown=Object.assign({},s.breakdown,d.breakdown);
      const dz=document.getElementById('dzone');
      if(dz){ dz.innerHTML=dataZone(s,s.breakdown,false);
        dz.querySelectorAll('.f').forEach(el=>el.style.width=el.dataset.w+'%'); }
    }
    drawChart(s); });
}
function drawChart(s){
  const host=document.getElementById('chartsec'); if(!host)return;
  const D=CH[s.ticker], b=s.breakdown||{};
  // Garde volontairement minimale : il faut des points, rien d'autre. L'ancienne
  // condition sur regression_sigma était un vestige (le canal est re-fitté
  // client sur la période affichée, la valeur du screener n'est jamais lue) —
  // elle privait de graphique toutes les fiches thématiques, dont le breakdown
  // compact ne porte pas ce champ.
  if(!D||!D.points||D.points.length<24){host.innerHTML='';return;}
  const W=800,H=360,ML=46,MR=44,MT=14,MB=26;
  const T_MIN=D.points[0][0], T_MAX=Math.max(D.t_last,D.points[D.points.length-1][0]), MIN_SPAN=12;
  const WIN=(b.regression_window_years||10)*12;
  const sym=curSym(s.ticker);
  const T_OFF=Math.max(T_MIN,D.t_win0);           // début de la fenêtre officielle
  let t0v=T_OFF, t1v=T_MAX;
  const MOIS=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  const fmt=t=>{const ti=Math.round(t);return MOIS[((ti%12)+12)%12]+' '+Math.floor(ti/12);};
  // presets : fenêtre officielle + 20A si ≥20 ans d'historique + MAX
  const pset=new Map([[WIN,(b.regression_window_years||10)+'A']]);
  if(T_MAX-T_MIN>=240)pset.set(240,'20A');
  const presets=[...pset.entries()].sort((a,c)=>a[0]-c[0]);presets.push([1e9,'MAX']);
  const dec=b.decote_pct, zOff=b.regression_z;
  const mlabel=dec==null?'':(dec>=0?'Décote':'Surcote')+' vs tendance '+(b.regression_window_years||'?')+' ans';
  const cons=(b.target_upside_pct!=null)?('<span class="chx-k">Objectif consensus : </span><span class="chx-v2">'+fs(b.target_upside_pct,0)+' %</span>'+(b.target_analysts?' <span class="chx-k">('+b.target_analysts+' analystes)</span>':'')):'';
  host.innerHTML='<div class="qh">Cours &amp; tendance long terme</div>'+
    '<div class="chx-wrap"><svg class="chx-svg" id="chx-svg" viewBox="0 0 '+W+' '+H+'"></svg><div class="chx-tip" id="chx-tip"></div></div>'+
    '<div class="chx-ctrl"><span id="chx-periods">'+presets.map(([m,l],i)=>'<button class="chx-pbtn'+(m===WIN?' on':'')+'" data-m="'+m+'">'+l+'</button>').join(' ')+'</span><span class="chx-rlbl" id="chx-rlbl"></span></div>'+
    '<div class="chx-slider" id="chx-slider"><div class="chx-track"></div><div class="chx-sel" id="chx-sel"></div><input type="range" id="chx-r0"><input type="range" id="chx-r1"></div>'+
    '<div class="chx-legend"><span style="color:var(--ac);font-weight:700">━</span> Cours&nbsp;&nbsp;<span style="color:var(--text2);font-weight:700">┅</span> <span id="chx-lgt">Tendance</span>&nbsp;&nbsp;<span style="color:#e0995e;font-weight:700">━</span> MM21&nbsp;&nbsp;<span style="color:#b59bd6;font-weight:700">━</span> MM200&nbsp;&nbsp;<span class="chx-band"></span> Canal ±1σ / ±2σ</div>'+
    (dec!=null?'<div class="chx-mrow">'+[
      '<span class="chx-k">'+mlabel+' : </span><span class="chx-v" title="Prix de tendance : '+(b.prix_tendance!=null?Math.round(b.prix_tendance)+sym:'—')+'">'+Math.abs(dec).toFixed(0)+' %</span>',
      '<span class="chx-k">z = </span><span class="chx-v2">'+fs(zOff,1).replace('.',',')+'σ</span>'
    ].concat(cons?[cons]:[]).join(' <span class="chx-k">·</span> ')+'</div>':'')+
    '<div id="chx-warnslot"></div>'+
    '<div class="chx-note">Canal recalculé sur la période affichée — décote et z-score restent calculés sur la fenêtre officielle ('+(b.regression_window_years||'?')+' ans). Trajectoire historique, pas une valeur intrinsèque. <a href="apprendre.html#decote" style="color:var(--text3)">Méthode →</a></div>';
  const svg=document.getElementById('chx-svg'),tip=document.getElementById('chx-tip');
  const r0=document.getElementById('chx-r0'),r1=document.getElementById('chx-r1'),selBar=document.getElementById('chx-sel');
  let X,Y,vis,hoverG,F=null;
  function computeFit(pts){
    // série hebdo récente + mensuelle ancienne : rééchantillonnage mensuel uniforme
    // et fit sur l'AXE DU TEMPS, sinon la période récente surpondère (bug du test réel)
    const byM=new Map();for(const p of pts)byM.set(Math.round(p[0]),p);
    const u=[...byM.values()].sort((a,c)=>a[0]-c[0]);
    if(u.length<24)return null;
    const t0=u[0][0],fitPts=u.slice(0,-1);            // holdout ~1 mois (méthode screener)
    const xs=fitPts.map(p=>p[0]-t0),ys=fitPts.map(p=>Math.log(p[1]));
    const n=xs.length,mx=xs.reduce((a,v)=>a+v,0)/n,my=ys.reduce((a,v)=>a+v,0)/n;
    let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2;}
    const bb=sxy/sxx,aa=my-bb*mx;
    let ss=0;for(let i=0;i<n;i++){const r=ys[i]-(aa+bb*xs[i]);ss+=r*r;}
    return {a:aa,b:bb,sigma:Math.sqrt(ss/(n-1)),t0};
  }
  const trF=t=>Math.exp(F.a+F.b*(t-F.t0));
  function el(n,at){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e}
  // Historique de cotation < 5 ans (néoclouds entrés le 01/08/2026, règle
  // d'exclusion supprimée) : la droite de régression est mathématiquement
  // calculable mais statistiquement vide — on la montre, et on le DIT. Le
  // seuil se lit sur la fenêtre EFFECTIVE publiée par le screener : un titre
  // à l'historique profond ne descend jamais sous 10 ans de fenêtre.
  const histCourt=(b.regression_window_years!=null&&b.regression_window_years<5)
    ?'<div class="chx-warn"><span class="chx-ic">⚠</span><div><b>Droite de régression non utilisable en l\'état — historique de cotation insuffisant ('+b.regression_window_years+' an'+(b.regression_window_years>1?'s':'')+', 5 ans minimum pour une tendance exploitable).</b> La décote, le z-score et le canal affichés sont indicatifs : trop peu de cycles pour qu\'une trajectoire « normale » existe. À lire pour la thèse et les fondamentaux, pas pour le timing.</div></div>'
    :'';
  function majWarn(officiel){
    const slot=document.getElementById('chx-warnslot');if(!slot)return;
    let zv=null;
    if(F&&vis.length){const [te,pe]=vis[vis.length-1];zv=(Math.log(pe)-Math.log(trF(te)))/F.sigma;}
    if(officiel&&zOff!=null)zv=zOff;   // sur la vue officielle, le z du screener fait foi
    const suf=officiel?'':' <span style="color:var(--text3)">(sur la période affichée)</span>';
    let zw='';
    if(zv!=null&&zv<=-2)zw='<div class="chx-warn"><span class="chx-ic">⚠</span><div><b>Écart extrême (&gt; 2σ sous la tendance'+(officiel?'':' de la période')+') — attention au changement structurel.</b>'+suf+' Si le business est durablement altéré (disruption, concurrence, régulation), la trajectoire passée ne reviendra pas : c\'est le piège de valeur. La décote chiffre un désaccord entre le passé et le prix — elle ne dit pas qui a raison. À croiser avec la qualité (score /45).</div></div>';
    else if(zv!=null&&zv>=2)zw='<div class="chx-warn"><span class="chx-ic">⚠</span><div><b>Surcote extrême (&gt; 2σ au-dessus de la tendance'+(officiel?'':' de la période')+') — attention à la chasse au rally.</b>'+suf+' Acheter ici, c\'est payer très au-dessus de la trajectoire historique : le retour vers la tendance est le scénario statistiquement fréquent. À croiser avec la qualité et la thèse.</div></div>';
    slot.innerHTML=histCourt+(histCourt?'':zw);   // hist. court : le z-warn serait du bruit sur un z déjà déclaré inexploitable
  }
  function chRender(){
    svg.innerHTML='<defs><clipPath id="chx-plot"><rect x="'+ML+'" y="'+MT+'" width="'+(W-ML-MR)+'" height="'+(H-MT-MB)+'"/></clipPath></defs>';
    vis=D.points.filter(([t])=>t>=t0v&&t<=t1v);
    F=computeFit(vis);
    const tb0=t0v,tb1=t1v,hasBand=!!F;
    let hi=Math.max(...vis.map(p=>p[1]))*1.12,lo=Math.min(...vis.map(p=>p[1]))*0.85;
    if(hasBand){const trHi=Math.max(trF(tb0),trF(tb1)),trLo=Math.min(trF(tb0),trF(tb1));
      hi=Math.max(hi,trHi*Math.exp(2*F.sigma)*1.03);lo=Math.min(lo,trLo*Math.exp(-2*F.sigma)*0.97);}
    X=t=>ML+(t-t0v)/(t1v-t0v)*(W-ML-MR);
    Y=p=>MT+(1-(Math.log(p)-Math.log(lo))/(Math.log(hi)-Math.log(lo)))*(H-MT-MB);
    // Pastilles de valeurs au bord droit : SUPPRIMÉES (2026-07, demande UX) — elles
    // masquaient les repères σ une fois sur deux. Les valeurs restent lisibles dans
    // la ligne de métriques sous le graphe et dans l'infobulle au survol.
    const chipYs=[];
    // grille Y (log, ticks bornés à ~8)
    const TICKS=[0.2,0.5,1,2,5,10,20,30,50,70,100,150,200,300,450,700,1000,1500,2500,5000,10000];
    const inD=TICKS.filter(p=>p>lo&&p<hi);const stride=Math.max(1,Math.ceil(inD.length/8));
    for(const p of inD.filter((_,i)=>i%stride===0)){
      el('line',{x1:ML,x2:W-MR,y1:Y(p),y2:Y(p),stroke:'rgba(255,255,255,.06)'});
      el('text',{x:ML-6,y:Y(p)+3,'text-anchor':'end',class:'chx-axis'}).textContent=(p<1?p.toFixed(2):p);}
    // axe X (années)
    const yrs=(t1v-t0v)/12,step=yrs>20?5:yrs>8?2:1;
    for(let y=Math.ceil(t0v/12);y*12<=t1v;y++)if(y%step===0)
      el('text',{x:X(y*12),y:H-7,'text-anchor':'middle',class:'chx-axis'}).textContent=y;
    if(hasBand){
      const band=(k,op)=>el('polygon',{points:[[X(tb0),Y(trF(tb0)*Math.exp(k*F.sigma))],[X(tb1),Y(trF(tb1)*Math.exp(k*F.sigma))],[X(tb1),Y(trF(tb1)*Math.exp(-k*F.sigma))],[X(tb0),Y(trF(tb0)*Math.exp(-k*F.sigma))]].map(p=>p.join(',')).join(' '),fill:'#74b6df','fill-opacity':op,'clip-path':'url(#chx-plot)'});
      // Intensité ADAPTATIVE : sur 20 ans/MAX l'échelle log s'étire et le canal ne fait
      // plus que quelques dizaines de px — les opacités fixes devenaient illisibles.
      // Plus le canal est fin à l'écran, plus fonds et liserés sont soutenus.
      const h2px=Math.abs(Y(trF(tb1)*Math.exp(-2*F.sigma))-Y(trF(tb1)*Math.exp(2*F.sigma)));
      const boost=Math.min(2.4,Math.max(1,150/Math.max(h2px,1)));
      band(2,0.045*boost);band(1,0.07*boost);
      // liserés des bords ±1σ/±2σ : gardent le canal lisible quand le zoom l'amincit
      for(const [k,op] of [[2,.14],[1,.22],[-1,.22],[-2,.14]])
        el('line',{x1:X(tb0),y1:Y(trF(tb0)*Math.exp(k*F.sigma)),x2:X(tb1),y2:Y(trF(tb1)*Math.exp(k*F.sigma)),
          stroke:'#74b6df','stroke-width':1,opacity:Math.min(op*boost,.5),'clip-path':'url(#chx-plot)'});
      // Étiquettes σ dans la MARGE droite, avec placement anti-collision : elles
      // glissent pour s'intercaler entre les pastilles. JAMAIS supprimées (les 4
      // repères σ doivent toujours être lisibles) : balayage large, et à défaut
      // de place propre, la position la moins gênée est retenue.
      const placed=chipYs.map(y=>({y,h:9}));
      for(const [k,l] of [[2,'+2σ'],[1,'+1σ'],[-1,'−1σ'],[-2,'−2σ']]){
        let yv=Y(trF(tb1)*Math.exp(k*F.sigma));
        if(yv<MT-2||yv>H-MB+2)continue;
        yv=Math.min(Math.max(yv,MT+4),H-MB-4);
        let spot=null,best=null,bestD=-1;
        for(const dy of [0,-4,4,-6,6,-8,8,-10,10,-12,12,-14,14,-16,16,-20,20,-24,24]){
          const cand=yv+dy;
          if(cand<MT+4||cand>H-MB-4)continue;
          const d=placed.length?Math.min(...placed.map(p=>Math.abs(cand-p.y))):1e9;
          if(d>=11){spot=cand;break;}
          if(d>bestD){bestD=d;best=cand;}
        }
        if(spot==null)spot=best;
        if(spot!=null){placed.push({y:spot,h:9});
          el('text',{x:W-MR+5,y:spot+3,class:'chx-blabel'}).textContent=l;}}
      el('line',{x1:X(tb0),y1:Y(trF(tb0)),x2:X(tb1),y2:Y(trF(tb1)),stroke:'#c6c6e0','stroke-width':2,'stroke-dasharray':'6 5',opacity:.85,'clip-path':'url(#chx-plot)'});
    }
    const mmLine=(serie,color)=>{const v=(serie||[]).filter(([t])=>t>=t0v&&t<=t1v);
      if(v.length>1)el('polyline',{points:v.map(([t,p])=>X(t)+','+Y(p)).join(' '),fill:'none',stroke:color,'stroke-width':1.3,opacity:.7,'clip-path':'url(#chx-plot)'});};
    mmLine(D.mm200,'#b59bd6');mmLine(D.mm21,'#e0995e');
    el('polyline',{points:vis.map(([t,p])=>X(t)+','+Y(p)).join(' '),fill:'none',stroke:'#74b6df','stroke-width':2,'stroke-linejoin':'round','clip-path':'url(#chx-plot)'});
    hoverG={cross:el('line',{y1:MT,y2:H-MB,stroke:'rgba(255,255,255,.18)','stroke-width':1,visibility:'hidden'}),
      dotP:el('circle',{r:4,fill:'#74b6df',stroke:'#0d0d16','stroke-width':2,visibility:'hidden'}),
      dotT:el('circle',{r:4,fill:'#c6c6e0',stroke:'#0d0d16','stroke-width':2,visibility:'hidden'}),
      dot21:el('circle',{r:4,fill:'#e0995e',stroke:'#0d0d16','stroke-width':2,visibility:'hidden'}),
      dot200:el('circle',{r:4,fill:'#b59bd6',stroke:'#0d0d16','stroke-width':2,visibility:'hidden'})};
    const officiel=Math.abs(t0v-T_OFF)<1.5&&t1v>=T_MAX-0.1;
    majWarn(officiel);
    document.getElementById('chx-rlbl').textContent=fmt(t0v)+' → '+fmt(t1v)+(officiel?' · fenêtre officielle du score':' · exploration');
    document.getElementById('chx-lgt').textContent=F?('Tendance '+(F.b>=0?'+':'')+(F.b*12*100).toFixed(1).replace('.',',')+' %/an sur la période'):'Tendance (période trop courte)';
    r0.value=t0v;r1.value=t1v;
    const pct=t=>(t-T_MIN)/(T_MAX-T_MIN)*100;
    selBar.style.left=pct(t0v)+'%';selBar.style.width=(pct(t1v)-pct(t0v))+'%';
  }
  r0.min=r1.min=Math.floor(T_MIN);r0.max=r1.max=Math.ceil(T_MAX);
  r0.addEventListener('input',()=>{t0v=Math.min(+r0.value,t1v-MIN_SPAN);setBtn(null);chRender();});
  r1.addEventListener('input',()=>{t1v=Math.max(+r1.value,t0v+MIN_SPAN);setBtn(null);chRender();});
  function setBtn(m){document.querySelectorAll('.chx-pbtn').forEach(x=>x.classList.toggle('on',+x.dataset.m===m));}
  document.getElementById('chx-periods').addEventListener('click',e=>{
    const btn=e.target.closest('.chx-pbtn');if(!btn)return;const m=+btn.dataset.m;
    t0v=(m===WIN)?T_OFF:Math.max(T_MIN,T_MAX-m);t1v=T_MAX;setBtn(m);chRender();});
  // survol + tactile : pointer events, réticule + 4 points + infobulle anti-recouvrement
  svg.addEventListener('pointermove',ev=>{
    if(!vis||!vis.length)return;
    const rb=svg.getBoundingClientRect();const mx=(ev.clientX-rb.left)*W/rb.width;
    let best=vis[0];for(const pt of vis)if(Math.abs(X(pt[0])-mx)<Math.abs(X(best[0])-mx))best=pt;
    const [t,p]=best,tv=F?trF(t):null;
    hoverG.cross.setAttribute('x1',X(t));hoverG.cross.setAttribute('x2',X(t));hoverG.cross.setAttribute('visibility','visible');
    hoverG.dotP.setAttribute('cx',X(t));hoverG.dotP.setAttribute('cy',Y(p));hoverG.dotP.setAttribute('visibility','visible');
    if(tv){hoverG.dotT.setAttribute('cx',X(t));hoverG.dotT.setAttribute('cy',Y(tv));hoverG.dotT.setAttribute('visibility','visible');}
    else hoverG.dotT.setAttribute('visibility','hidden');
    const near=se=>{let z=null;for(const q of (se||[])){if(q[0]>t)break;z=q;}return z;};
    const m21=near(D.mm21),m200=near(D.mm200);
    const setDot=(dot,q)=>{if(q&&q[0]>=t0v){dot.setAttribute('cx',X(q[0]));dot.setAttribute('cy',Y(q[1]));dot.setAttribute('visibility','visible');}else dot.setAttribute('visibility','hidden');};
    setDot(hoverG.dot21,m21);setDot(hoverG.dot200,m200);
    tip.innerHTML='<span class="d">'+fmt(t)+'</span><br>● Cours&nbsp;: <span class="c">'+p.toFixed(p<10?2:0)+sym+'</span><br>'
      // « si retour à la tendance : +33 % » plutôt que « écart −25 % » : même
      // information, lue dans le sens utile — le potentiel si le cours rejoint
      // sa droite. Le conditionnel est la partie honnête de la phrase : la
      // tendance est une trajectoire passée, pas un objectif (règle 14).
      +(tv?'◌ Tendance&nbsp;: <span class="t">'+tv.toFixed(tv<10?2:0)+sym+'</span><br>&nbsp;&nbsp;&nbsp;si retour à la tendance&nbsp;: <span class="t">'+((tv/p-1)*100>0?'+':'')+((tv/p-1)*100).toFixed(0)+'&nbsp;%</span>':'◌ période trop courte pour une tendance')
      +(m21&&m200?'<br><span style="color:#e0995e">MM21 '+m21[1].toFixed(0)+sym+'</span> · <span style="color:#b59bd6">MM200 '+m200[1].toFixed(0)+sym+'</span>':'');
    // positionnement APRÈS écriture du contenu (largeur réelle) : toujours d'un seul côté du réticule
    const wr=svg.parentNode.getBoundingClientRect();
    tip.style.display='block';
    const cxPix=X(t)*rb.width/W+(rb.left-wr.left);
    const tw=tip.offsetWidth||210;
    let lx=cxPix+16;if(lx+tw>wr.width)lx=cxPix-tw-16;
    tip.style.left=Math.max(0,lx)+'px';
    tip.style.top=Math.max(Math.min(ev.clientY-wr.top-70,wr.height-110),0)+'px';});
  svg.addEventListener('pointerleave',()=>{if(!hoverG)return;for(const k in hoverG)hoverG[k].setAttribute('visibility','hidden');tip.style.display='none';});
  chRender();
}
function qLabel(iso){ if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null; const [y,m,d]=iso.split('-').map(Number); return {q:'T'+(Math.floor((m-1)/3)+1)+' '+y, d:String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y}; }
function periodNote(b){ const p=qLabel(b&&b.mrq); const ca=p?'dernier trimestre publié ('+p.q+')':'dernier trimestre publié'; const ttm=p?' au '+p.d:''; return 'Fondamentaux — CA : '+ca+' en glissement annuel (a/a) · marges nette &amp; FCF : 12 mois glissants (TTM)'+ttm+'.'; }
/* Fiche d'un titre thématique hors watchlist principale : universe.json ne
   porte qu'un breakdown compact (ni fondamentaux détaillés, ni graphique, ni
   fiche éditoriale). On publie ce qu'on a, et on le DIT — l'absence est un
   choix éditorial explicite, pas une panne. */
function compactMetrics(s){const b=s.breakdown||{},u=s._u||{};
  const dev=u.devise?' '+u.devise:'';
  const dl=b.decote_pct==null?'Décote vs tendance':(b.decote_pct>=0?'Décote vs tendance':'Surcote vs tendance');
  return '<div class="metrics">'+
    mk('Cours',(u.prix!=null?f(u.prix,2)+dev:'—'))+
    mk('Cross',(b.cross_type||'neutre')+(b.cross_days_ago!=null?' '+b.cross_days_ago+'j':''))+
    mk(dl,(b.decote_pct==null?'—':Math.abs(b.decote_pct).toFixed(0)+'%'))+
    mk('Z-score'+(b.regression_window_years?' · '+b.regression_window_years+' ans':''),fs(b.regression_z,1).replace('.',',')+'σ')+
    mk('RSI',f(b.rsi,0))+
    mk('Objectif consensus',(b.target_upside_pct==null?'—':fs(b.target_upside_pct,0)+'%')+(b.target_analysts?' ('+b.target_analysts+')':''))+
  '</div><div class="metrics-note">Chiffres issus du même run du screener que la watchlist principale'+(U.updated_at?' ('+sv(U.updated_at)+')':'')+'. Croissance, marges et bilan détaillés ne sont pas publiés dans les vues thématiques.</div>';}
/* Titre sans AUCUNE fiche : ne devrait plus arriver depuis que l'éditorial
   couvre tout l'univers tagué, mais un run partiel (budget de temps épuisé)
   peut encore laisser un titre sans texte. On le dit plutôt que d'afficher
   une page à trous. */
function liteNote(){
  return '<div class="lite-note"><h4>Analyse pas encore rédigée</h4>'+
  '<p>Ce titre est scoré par exactement la même méthode que les autres — les chiffres ci-dessus sortent du même run. Son analyse rédigée n\'a simplement pas encore été produite : elles sont générées par ordre de priorité à chaque mise à jour hebdomadaire, et celle-ci attend son tour.</p>'+
  '<p><a href="apprendre.html">Comment lire ces chiffres →</a></p></div>';
}
/* Note de bas de fiche pour le niveau « thematique » : la rubrique Actu est
   absente par construction, pas par oubli — aucune source datée n'est
   collectée pour ces titres, et on ne fabrique pas d'actualité. */
function briefNote(){
  return '<div class="lite-note"><h4>Fiche courte</h4>'+
  '<p>Ce titre appartient à une watchlist thématique sans figurer dans le <a href="'+hashOf(MAIN)+'">top 30</a>. Son analyse couvre le business, les perspectives et les deux thèses ; la revue d\'actualité, elle, n\'est produite que pour la watchlist principale — faute de source datée collectée pour ce titre, elle serait inventée.</p></div>';
}
/* Bandeau de thème au-dessus de la fiche. La vue liste intermédiaire a été
   supprimée (elle dupliquait le rail), mais la thèse, son inversion et ses
   biais ne doivent pas disparaître pour autant : c'est la couche d'honnêteté
   du dispositif. Repliée par défaut pour ne pas manger la fiche. */
function themeBar(meta){
  if(!meta||meta.id===MAIN||!meta.thesis)return '';
  const deg=meta.status==='degraded'?'<span class="tb-deg">couverture partielle</span>':'';
  const cnt=meta.eligibles!=null?meta.scores+' retenus / '+meta.eligibles+' éligibles'
                                :meta.scores+' titres';
  return '<details class="tbar"><summary><span class="tb-k">'+sv(meta.kind==='calcule'?'calculé':meta.kind==='secteur'?'secteur':'thèse')+
    '</span><span class="tb-l">'+sv(meta.label)+'</span><span class="tb-c">'+cnt+'</span>'+deg+
    '<span class="tb-x">thèse ▾</span></summary><div class="tb-body">'+
    '<p>'+sv(meta.thesis)+'</p>'+
    (meta.regle_texte?'<div class="tb-n"><h5>Règle de sélection</h5><p>'+sv(meta.regle_texte)+'</p></div>':'')+
    (meta.inversion?'<div class="tb-n"><h5>Ce qui invaliderait cette thèse</h5><p>'+sv(meta.inversion)+'</p></div>':'')+
    (meta.biais?'<div class="tb-n"><h5>Biais de ce thème</h5><p>'+sv(meta.biais)+'</p></div>':'')+
    '</div></details>';
}

/* Zone de données chiffrées (jauges + décomposition + rangée de métriques).
   Isolée dans #dzone parce qu'elle peut être RE-RENDUE seule : une fiche
   compacte est promue au niveau top 30 quand charts/<TICKER>.json livre le
   breakdown complet — on remplace alors cette zone sans toucher au résumé
   (l'animation de frappe repartirait de zéro) ni au graphique. */
function dataZone(s,b,compact){
  const rsi=b.rsi==null?50:Math.max(0,Math.min(100,b.rsi)),zp=Math.max(0,Math.min(100,((b.regression_z==null?0:b.regression_z)+3)/6*100));
  return '<div class="quant"><div><div class="qh">Signaux de timing</div><div class="gauge"><div class="gl"><span>RSI · réf. 30 / 70</span><b>'+f(b.rsi,0)+'</b></div><div class="gtrack"><span class="gtick" style="left:30%"></span><span class="gtick" style="left:70%"></span><span class="gmark" style="left:'+rsi+'%"></span></div></div><div class="gauge"><div class="gl"><span>Z-SCORE'+(b.regression_window_years?' · '+b.regression_window_years+' ans':'')+'</span><b>'+fs(b.regression_z,1).replace('.',',')+'σ</b></div><div class="gtrack"><span class="gtick" style="left:50%"></span><span class="gmark" style="left:'+zp+'%"></span></div></div></div>'+
      '<div><div class="qh">Décomposition du score</div>'+meter('Qualité',b.qualite||0,45)+meter('Valorisation',b.valorisation||0,30)+meter('Timing',b.timing||0,22)+(compact?'':meter('Analystes',b.analystes||0,3))+'</div></div>'+
    (compact?compactMetrics(s)
      :'<div class="metrics">'+mk('Cross',(b.cross_type||'—')+(b.cross_days_ago!=null?' '+b.cross_days_ago+'j':''))+mk('Pente MM21',fs(b.cross_slope_mm21_pct,1)+'%')+mk('Draw 52s',fs(b.drawdown_52w_pct,1)+'%')+mk('Croiss CA · a/a',fs(b.rev_growth_pct,1)+'%')+mk('Marge nette · TTM',f(b.net_margin_pct,1)+'%')+mk('Marge FCF · TTM',f(b.fcf_margin_pct,1)+'%')+'</div><div class="metrics-note">'+periodNote(b)+'</div>');
}

function render(s){const b=s.breakdown||{},a=A[s.ticker],doc=document.getElementById('doc');
  const compact=!!s._c&&!s._up, hasEd=!!(a&&(a.resume||a.biz||a.futur||a.actu||a.bull||a.bear));
  const score=s.score==null?0:s.score;
  const C=2*Math.PI*52,off=C*(1-score/100);
  const resumeBody=a&&a.resume?a.resume.map(p=>'<p class="resume">'+sv(p)+'</p>').join('')
    :compact?'<p class="resume">'+sv(s.name)+' — score '+score+'/100 : qualité '+(b.qualite==null?'—':b.qualite+'/45')+', valorisation '+(b.valorisation==null?'—':b.valorisation+'/30')+', timing '+(b.timing==null?'—':b.timing+'/22')+'. '+stateTag(b)+', RSI '+f(b.rsi,0)+', z-score '+fs(b.regression_z,1).replace('.',',')+'σ sur '+(b.regression_window_years||'?')+' ans.</p>'
    :'<p class="resume">'+sv(s.name)+' — score '+score+'/100. '+stateTag(b)+'. Croissance CA '+fs(b.rev_growth_pct,0)+' % (dern. trim., a/a), marge nette '+f(b.net_margin_pct,0)+' % (TTM), z-score '+fs(b.regression_z,1).replace('.',',')+'σ.</p><p class="resume stub">Synthèse qualitative à générer.</p>';
  const bb=(a&&(a.bull||a.bear))?'<div class="bullbear"><div class="bb bb-bull"><div class="bb-h">▲ Thèse haussière</div>'+bblist(a.bull)+'</div><div class="bb bb-bear"><div class="bb-h">▼ Thèse baissière</div>'+bblist(a.bear)+'</div></div>':'';
  // recouvrement des thèmes, visible depuis la fiche elle-même
  const tt=themesOf(s.ticker).map(id=>{const t=TBY[id];return t?'<a class="ttag" href="'+hashOf(id)+'">'+sv(t.label)+'</a>':'';}).join('');
  // Trois cas, distingués par le niveau de fiche publié par le générateur.
  // Une fiche « thematique » n'a PAS de rubrique Actu par construction : aucune
  // source datée n'est collectée pour ces titres. Afficher « À générer » y
  // serait un mensonge — cette rubrique ne viendra jamais.
  const brief=(a&&a._niveau==='thematique');
  const prose=!hasEd?'<div class="prose">'+liteNote()+'</div>'
    :'<div class="prose"><div>'+sec('Business &amp; Moat',a&&a.biz?paras(a.biz):'<p class="stub">À générer.</p>')+'</div><div>'+sec('Perspectives',a&&a.futur?paras(a.futur):'<p class="stub">À générer.</p>')+'</div>'+
      (brief?'':'<div>'+sec('Actu',(a&&a.actu?paras(a.actu):'<p class="stub">À générer.</p>'))+'</div>')+'</div>'+
      (brief?briefNote():'');
  doc.classList.remove('on');
  doc.innerHTML=(curWl?'<div class="wl-crumb"><a href="#/">← Watchlists</a><span class="sepc">/</span><span class="crumb-cur">'+sv(curWl.label)+'</span></div>'+themeBar(curWl):'')+
    '<div class="d-head"><div><div class="d-tk">'+sv(s.ticker)+'</div><div class="d-nm">'+sv(s.name)+' · '+sv(s.sector)+'</div><div class="d-tagrow"><span class="d-tag">'+stateTag(b)+'</span><span class="d-reg">'+region(s)+'</span></div>'+(tt?'<div class="d-themes">'+tt+'</div>':'')+'</div>'+
    '<div class="ring"><svg width="138" height="138"><circle cx="69" cy="69" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="69" cy="69" r="52" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1s ease" id="arc"/></svg><div class="rv"><div class="rl">SCORE</div><div class="rn" id="cu">0</div></div></div></div>'+
    '<div class="sep"></div><div id="rzone"></div>'+
    '<div id="chartsec"></div>'+
    '<div id="dzone">'+dataZone(s,b,compact)+'</div>'+
    prose+
    (bb?sec('Bull vs Bear',bb,'bbsec'):'');
  requestAnimationFrame(()=>{doc.classList.add('on');const rz=document.getElementById('rzone');if(rz){reduce?(rz.innerHTML=resumeBody):typeHTML(rz,resumeBody);}buildChart(s);const arc=document.getElementById('arc');if(arc)arc.style.strokeDashoffset=off;doc.querySelectorAll('.f').forEach(el=>el.style.width=el.dataset.w+'%');const cu=document.getElementById('cu');const _ct=performance.now();(function up(){const e=Math.min(1,(performance.now()-_ct)/600);if(cu)cu.textContent=Math.round(e*score);if(e<1)requestAnimationFrame(up);})();});
}
</script>
