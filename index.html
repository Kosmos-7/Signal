<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Terminal d'analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signal.css">
<style>
  /* ── index (terminal watchlist) : mise en page propre à la page ── */
  body{overflow:hidden}

  /* RAIL : nom complet + région + secteur */
  .rail{position:fixed;left:1.4rem;top:5rem;bottom:1.4rem;z-index:6;width:232px;display:flex;flex-direction:column}
  .rail-h{display:flex;justify-content:space-between;font:600 .62rem var(--mono);letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;padding:0 .4rem .6rem;border-bottom:1px solid var(--line)}
  .rail-l{overflow-y:auto;flex:1;mask-image:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}.rail-l::-webkit-scrollbar{width:0}
  .rail-lex{display:block;margin-top:.4rem;padding:.65rem .4rem .1rem;border-top:1px solid var(--line);font:600 .6rem var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s;cursor:pointer;flex:0 0 auto}
  .rail-lex::before{content:'§ '}
  .rail-lex:hover,.rail-lex.active{color:var(--ac)}
  .lexg{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.8rem;margin-top:.5rem}
  .lext{font:700 .8rem var(--mono);color:var(--ac);letter-spacing:.3px;margin-bottom:.3rem}
  .lexd{font-size:.92rem;color:var(--text2);line-height:1.6}
  .lexd em{font-style:normal;color:var(--text)}
  @media(max-width:900px){.lexg{grid-template-columns:1fr}}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:.5rem .4rem;cursor:pointer;border-bottom:1px solid var(--line);transition:padding-left .18s,border-color .18s}
  .row:hover,.row.sel{padding-left:.7rem}.row.sel{border-left:2px solid var(--ac);margin-left:-2px;padding-left:calc(.7rem - 2px)}
  .row .nm{font:500 .82rem var(--serif);line-height:1.2;color:var(--text2)}.row:hover .nm,.row.sel .nm{color:#fff}
  .rl-meta{display:flex;align-items:center;gap:6px;margin-top:4px}
  .reg{font:600 .52rem var(--mono);letter-spacing:.5px;color:var(--text3);border:1px solid var(--line);border-radius:3px;padding:1px 4px}
  .sct{font:.58rem var(--mono);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .row .rr{text-align:right}.row .sc{font:500 .95rem var(--serif);color:var(--text)}.row .xx{font:.55rem var(--mono);color:var(--text3);letter-spacing:.5px;margin-top:1px}

  /* STAGE : analyse élargie */
  .stage{position:fixed;left:262px;right:1.4rem;top:4.6rem;bottom:1.4rem;z-index:5;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
  footer{width:100%;max-width:1060px;margin-top:.5rem;padding:1.4rem 1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1.2rem;flex-wrap:wrap}
  footer .footer-legal{font-size:.75rem;color:var(--text3);line-height:1.5;max-width:560px}
  footer .footer-right{font:.75rem var(--mono);color:var(--text3);white-space:nowrap}
  @media(max-width:900px){footer{flex-direction:column;align-items:flex-start;gap:.5rem;padding:1.25rem 1rem}}
  .stage::-webkit-scrollbar{width:5px}.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  .doc{width:100%;max-width:1060px;padding:.5rem 1.5rem 2.5rem;opacity:0;transition:opacity .35s}.doc.on{opacity:1}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
  .d-tk{font-family:var(--serif);font-size:3.4rem;line-height:.95;letter-spacing:-1px}
  .d-nm{font-size:.98rem;color:var(--text2);margin-top:.25rem}
  .d-tagrow{display:flex;align-items:center;gap:10px;margin-top:.85rem}
  .d-tag{font:600 .62rem var(--mono);letter-spacing:1.5px;text-transform:uppercase;padding:4px 11px;border:1px solid var(--line);color:var(--text2);border-radius:4px}
  .d-reg{font:600 .6rem var(--mono);letter-spacing:1px;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:4px 9px}

  .resume{font-size:1.04rem;line-height:1.75;color:var(--text);font-weight:400;max-width:1040px}.resume + .resume{margin-top:.75rem}

  .quant{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin:1.8rem 0}
  .qh{font:600 .6rem var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--ac);margin-bottom:.7rem;display:flex;align-items:center;gap:10px}.qh::after{content:'';flex:1;height:1px;background:var(--line)}
  .meter{grid-template-columns:104px 1fr 44px}   /* labels en toutes lettres */

  .prose{margin-top:1.8rem;max-width:1040px}

  .bbsec{margin-top:1.9rem}
  .bbsec .sec-h{color:var(--text2)}

  /* apparition échelonnée des sections (futuriste) */
  .doc.on .resume,.doc.on .quant,.doc.on .metrics,.doc.on .prose,.doc.on .bbsec{animation:rise .5s ease both}
  .doc.on .quant{animation-delay:.05s}.doc.on .metrics{animation-delay:.1s}.doc.on .prose{animation-delay:.15s}.doc.on .bbsec{animation-delay:.2s}

  /* repli mobile : rail + stage repassent en flux vertical */
  @media(max-width:900px){
    body{overflow:auto}
    .rail{position:static;left:auto;top:auto;bottom:auto;width:auto;margin:4.6rem 1rem 0}
    .rail-l{max-height:38vh}
    .stage{position:static;left:auto;right:auto;top:auto;bottom:auto;margin:1rem 0 0;overflow:visible}
    .d-tk{font-size:2.6rem}
    .quant{grid-template-columns:1fr;gap:1rem}
  }
</style>
</head>
<body>
<div id="fx"></div>
<canvas id="bg"></canvas>
<div class="scan"></div>
<div class="frame"><i></i><i></i><i></i><i></i></div>

<header>
  <a class="brand" href="index.html"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 14 L7 14 L9.5 8.5 L13.5 20.5 L16.5 5 L20 14 L24.5 14" stroke="#22d98a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">Signal</span></a>
  <nav><a href="index.html" class="active">Watchlist</a><a href="portfolio.html">Portefeuille IA</a><a href="apprendre.html">Apprendre</a></nav>
</header>

<div class="rail"><div class="rail-h"><span id="rc">—</span><span id="rw"></span></div><div class="rail-l" id="rl"></div><a class="rail-lex" id="lexlink" href="#lexique">Lexique des signaux</a></div>
<div class="stage"><div class="doc" id="doc"></div><footer><div class="footer-legal">Signal est un service éditorial d'information financière. Contenu fourni à titre informatif uniquement. Ne constitue pas un conseil en investissement au sens AMF.</div><div class="footer-right">Bêta</div></footer></div>

<script src="signal-fx.js"></script>
<script>
const A={};
const f=(v,d=1)=>v==null?'—':(+v).toFixed(d),fs=(v,d=1)=>v==null?'—':(v>0?'+':'')+(+v).toFixed(d);
let stocks=[],sel=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

Promise.all([
  fetch('watchlist.json?v='+Date.now()).then(r=>r.json()),
  fetch('analyses.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([wl,an])=>{
  Object.assign(A, an||{});
  stocks=wl.stocks.slice().sort((a,b)=>b.score-a.score);
  document.getElementById('rc').textContent=stocks.length+' valeurs';document.getElementById('rw').textContent=(wl.week||'').replace('Sem. ','S');
  listBuild();
  document.getElementById('lexlink').addEventListener('click',e=>{e.preventDefault();showLexique();});
  if(location.hash==='#lexique'){showLexique();}else if(stocks[0])pick(stocks[0]);
});

function crossShort(b){return b.cross_type==='golden'?'GC':b.cross_type==='death'?'DC':'—';}
function region(s){return s.badge||'US';}
function listBuild(){const l=document.getElementById('rl');l.innerHTML='';stocks.forEach(s=>{const b=s.breakdown||{},r=document.createElement('div');r.className='row';s._r=r;
  r.innerHTML='<div><div class="nm">'+s.name+'</div><div class="rl-meta"><span class="reg">'+region(s)+'</span><span class="sct">'+(s.sector||'')+'</span></div></div>'+
    '<span class="rr"><div class="sc">'+s.score+'</div></span>';
  r.addEventListener('click',()=>pick(s));l.appendChild(r);});}

function stateTag(b){const ct=b.cross_type==='golden'?'GOLDEN CROSS':b.cross_type==='death'?'DEATH CROSS':'CROSS NEUTRE';return ct+(b.cross_days_ago!=null?' · '+b.cross_days_ago+' J':'');}
function momProse(b){let s='';s+=(b.cross_type==='golden'?'Golden cross':b.cross_type==='death'?'Death cross':'Cross neutre')+(b.cross_days_ago!=null?' il y a '+b.cross_days_ago+' j':'')+' · pente MM21 '+fs(b.cross_slope_mm21_pct,1)+' %. ';s+='RSI '+f(b.rsi,0)+' (réf. 30 / 70). ';s+='Z-score '+fs(b.regression_z,2)+'σ vs régression long terme'+(b.regression_window_years?' ('+b.regression_window_years+' ans)':'')+'. ';s+='Drawdown 52 s '+fs(b.drawdown_52w_pct,1)+' %.';return s;}
function fondProse(b){let s='Bloc fondamental '+(b.fondamentaux||0)+' / 50. ';if(b.rev_growth_pct!=null)s+='Croissance CA '+fs(b.rev_growth_pct,1)+' %. ';if(b.net_margin_pct!=null)s+='Marge nette '+f(b.net_margin_pct,1)+' %. ';if(b.fcf_margin_pct!=null)s+='Marge FCF '+f(b.fcf_margin_pct,1)+' %. ';s+='Consensus analystes '+(b.analystes||0)+' / 5.';return s;}
function paras(a){return a.map(p=>'<p>'+p+'</p>').join('');}
function meter(l,v,m){return'<div class="meter"><span>'+l+'</span><span class="t"><span class="f" data-w="'+(v/m*100)+'"></span></span><span class="mv">'+v+'/'+m+'</span></div>';}
function sec(h,body,cls){return'<div class="sec '+(cls||'')+'"><div class="sec-h">'+h+'</div>'+body+'</div>';}
function mk(k,v){return'<div><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
function bblist(arr){return arr&&arr.length?'<ul>'+arr.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'<p class="stub">—</p>';}

function typeHTML(el,html){const tmp=document.createElement('div');tmp.innerHTML=html;const ps=[...tmp.querySelectorAll('p')];const full=(ps.length?ps.map(p=>p.textContent):[tmp.textContent]).join('  ');el.innerHTML='<p class="resume type-cur" id="rtype"></p>';const t=document.getElementById('rtype');const _tt=performance.now(),dur=Math.min(1500,Math.max(500,full.length*6));(function tick(){const e=Math.min(1,(performance.now()-_tt)/dur);if(t)t.textContent=full.slice(0,Math.floor(e*full.length));if(e<1)requestAnimationFrame(tick);else el.innerHTML=html;})();}
function pick(s){sel=s;stocks.forEach(o=>o._r&&o._r.classList.toggle('sel',o===s));var ll=document.getElementById('lexlink');if(ll)ll.classList.remove('active');render(s);}
function lexi(t,d){return '<div><div class="lext">'+t+'</div><div class="lexd">'+d+'</div></div>';}
function lexsec(h,items){return '<div class="sec"><div class="sec-h">'+h+'</div><div class="lexg">'+items+'</div></div>';}
function showLexique(){
  sel=null;stocks.forEach(o=>o._r&&o._r.classList.remove('sel'));
  var ll=document.getElementById('lexlink');if(ll)ll.classList.add('active');
  if(history.replaceState)history.replaceState(null,'','#lexique');
  const doc=document.getElementById('doc');doc.classList.remove('on');
  doc.innerHTML='<div class="d-head"><div><div class="d-tk">Lexique</div><div class="d-nm">Comment lire une fiche · définitions des signaux</div></div></div>'+
    '<div class="sep"></div>'+
    lexsec('Le score',
      lexi('Score /100','Note de synthèse = <em>Momentum 45</em> + <em>Fondamentaux 50</em> + <em>Analystes 5</em>. Indicateur de <em>qualité</em> à un instant T, pas de timing : un score élevé ne garantit pas une hausse imminente.')+
      lexi('Momentum · 45 pts','Dynamique technique : croisement de moyennes (20 pts), RSI (10), volume (5), position vs régression (5), valorisation conditionnée au régime de cross (5).')+
      lexi('Fondamentaux · 50 pts','Santé financière concrète : croissance du chiffre d\'affaires, marge nette, marge de free cash-flow, PEG (valorisation rapportée à la croissance), endettement.')+
      lexi('Analystes · 5 pts','Consensus sell-side (Acheter / Conserver / Vendre). Volontairement peu pondéré : biais acheteur structurel et révisions retardées.')+
      lexi('Étoiles','Résumé visuel du score : 5★ ≥ 90, 4★ ≥ 75, 3★ ≥ 60.'))+
    lexsec('Signaux techniques',
      lexi('Golden Cross / Death Cross','<em>Golden Cross</em> : la MM21 passe au-dessus de la MM200 — signal haussier. <em>Death Cross</em> : MM21 sous MM200 — baissier. Plus le croisement est récent, plus le signal pèse.')+
      lexi('MM21 / MM200','Moyennes mobiles sur 21 et 200 jours : elles lissent les soubresauts quotidiens. La <em>MM21</em> réagit vite (court terme), la <em>MM200</em> donne la tendance de fond.')+
      lexi('RSI','Oscillateur 0–100 de la vitesse des variations récentes. <em>Zone saine : 40–60.</em> Au-delà de 70 : surachat. Sous 30 : survente.')+
      lexi('Z-score (σ)','Écart du cours à sa droite de régression long terme, en écarts-types. <em>−2σ</em> = décote marquée (rebond possible) ; <em>+2σ</em> = cours tendu au-dessus de sa tendance.')+
      lexi('Pente MM21','Inclinaison de la MM21 : positive = momentum qui se renforce, négative = qui s\'essouffle.')+
      lexi('Drawdown 52 s','Baisse depuis le plus haut des 52 dernières semaines, en %. Le repli déjà encaissé.'))+
    lexsec('Fondamentaux',
      lexi('Croissance CA','Variation du chiffre d\'affaires sur un an.')+
      lexi('Marge nette','Bénéfice net rapporté au chiffre d\'affaires.')+
      lexi('Marge FCF','Free cash-flow (trésorerie réellement générée) rapporté au CA — plus difficile à maquiller comptablement que la marge nette.')+
      lexi('Consensus analystes','Recommandation moyenne sell-side, échelle Acheter / Conserver / Vendre.'));
  requestAnimationFrame(()=>doc.classList.add('on'));
}
function render(s){const b=s.breakdown||{},a=A[s.ticker],doc=document.getElementById('doc');
  const rsi=b.rsi==null?50:Math.max(0,Math.min(100,b.rsi)),zp=Math.max(0,Math.min(100,((b.regression_z==null?0:b.regression_z)+3)/6*100));
  const C=2*Math.PI*52,off=C*(1-s.score/100);
  const resumeBody=a&&a.resume?a.resume.map(p=>'<p class="resume">'+p+'</p>').join(''):'<p class="resume">'+s.name+' — score '+s.score+'/100. '+stateTag(b)+'. Croissance CA '+fs(b.rev_growth_pct,0)+' %, marge nette '+f(b.net_margin_pct,0)+' %, z-score '+fs(b.regression_z,1)+'σ.</p><p class="resume stub">Synthèse qualitative à générer.</p>';
  const bb=(a&&(a.bull||a.bear))?'<div class="bullbear"><div class="bb bb-bull"><div class="bb-h">▲ Thèse haussière</div>'+bblist(a.bull)+'</div><div class="bb bb-bear"><div class="bb-h">▼ Thèse baissière</div>'+bblist(a.bear)+'</div></div>':'';
  doc.classList.remove('on');
  doc.innerHTML='<div class="d-head"><div><div class="d-tk">'+s.ticker+'</div><div class="d-nm">'+s.name+' · '+s.sector+'</div><div class="d-tagrow"><span class="d-tag">'+stateTag(b)+'</span><span class="d-reg">'+region(s)+'</span></div></div>'+
    '<div class="ring"><svg width="138" height="138"><circle cx="69" cy="69" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="69" cy="69" r="52" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1s ease" id="arc"/></svg><div class="rv"><div class="rl">SCORE</div><div class="rn" id="cu">0</div><div class="rs">'+s.stars+'/5</div></div></div></div>'+
    '<div class="sep"></div><div id="rzone"></div>'+
    '<div class="quant"><div><div class="qh">Signaux techniques</div><div class="gauge"><div class="gl"><span>RSI · réf. 30 / 70</span><b>'+f(b.rsi,0)+'</b></div><div class="gtrack"><span class="gtick" style="left:30%"></span><span class="gtick" style="left:70%"></span><span class="gmark" style="left:'+rsi+'%"></span></div></div><div class="gauge"><div class="gl"><span>Z-SCORE'+(b.regression_window_years?' · '+b.regression_window_years+' ans':'')+'</span><b>'+fs(b.regression_z,2)+'σ</b></div><div class="gtrack"><span class="gtick" style="left:50%"></span><span class="gmark" style="left:'+zp+'%"></span></div></div></div>'+
      '<div><div class="qh">Décomposition du score</div>'+meter('Momentum',b.momentum||0,45)+meter('Fondamentaux',b.fondamentaux||0,50)+meter('Analystes',b.analystes||0,5)+'</div></div>'+
    '<div class="metrics">'+mk('Cross',(b.cross_type||'—')+(b.cross_days_ago!=null?' '+b.cross_days_ago+'j':''))+mk('Pente MM21',fs(b.cross_slope_mm21_pct,1)+'%')+mk('Draw 52s',fs(b.drawdown_52w_pct,1)+'%')+mk('Croiss CA',fs(b.rev_growth_pct,1)+'%')+mk('Marge net',f(b.net_margin_pct,1)+'%')+mk('Marge FCF',f(b.fcf_margin_pct,1)+'%')+'</div>'+
    '<div class="prose"><div>'+sec('Business &amp; Moat',a&&a.biz?paras(a.biz):'<p class="stub">À générer.</p>')+'</div><div>'+sec('Perspectives',a&&a.futur?paras(a.futur):'<p class="stub">À générer.</p>')+'</div>'+
      '<div>'+sec('Actu',(a&&a.actu?paras(a.actu):'<p class="stub">À générer.</p>'))+'</div></div>'+
    (bb?sec('Bull vs Bear',bb,'bbsec'):'');
  requestAnimationFrame(()=>{doc.classList.add('on');const rz=document.getElementById('rzone');if(rz){reduce?(rz.innerHTML=resumeBody):typeHTML(rz,resumeBody);}const arc=document.getElementById('arc');if(arc)arc.style.strokeDashoffset=off;doc.querySelectorAll('.f').forEach(el=>el.style.width=el.dataset.w+'%');const cu=document.getElementById('cu');const _ct=performance.now();(function up(){const e=Math.min(1,(performance.now()-_ct)/600);if(cu)cu.textContent=Math.round(e*s.score);if(e<1)requestAnimationFrame(up);})();});
}
</script>
</body>
</html>
