# Outil ponctuel : échantillonne les données réelles d'un ticker (prix max,
# MM21/MM200 quotidiennes, régression méthode screener, consensus) et committe
# le JSON sur la branche de travail — sert à valider la maquette graphique
# avec de vraies données avant l'implémentation production.
name: Fetch chart sample (outil test)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker à échantillonner'
        required: false
        default: 'ADBE'

permissions:
  contents: write

concurrency:
  group: fetch-chart-sample
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branche de travail
        uses: actions/checkout@v4
        with:
          ref: claude/signal-project-access-drn60o

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch données réelles
        env:
          TICKER: ${{ github.event.inputs.ticker || 'ADBE' }}
        run: |
          pip install -q yfinance==1.3.0 pandas==3.0.2 numpy==2.4.4
          python - <<'EOF'
          import os, json, math
          import numpy as np, pandas as pd, yfinance as yf

          t  = os.environ.get("TICKER", "ADBE")
          tk = yf.Ticker(t)
          hist  = tk.history(period="max", auto_adjust=True)
          close = hist["Close"].squeeze().dropna()
          info  = tk.info

          # Fenêtre effective (logique screener : tech 10y / cyclique 25y / standard 20y)
          sector = info.get("sector", "") or ""
          TECH = {"Technology", "Communication Services"}
          CYCL = {"Industrials", "Energy", "Basic Materials", "Consumer Cyclical", "Financial Services"}
          if sector in TECH:   win_days, win_label = 2520, "10 ans (profil tech)"
          elif sector in CYCL: win_days, win_label = 6300, "25 ans (profil cyclique)"
          else:                win_days, win_label = 5040, "20 ans (standard)"

          cw = close.iloc[-win_days:] if len(close) >= win_days else close
          # Régression — méthode EXACTE du screener (holdout 20j, ddof=1)
          log_p = np.log(cw.values); n = len(log_p)
          fit = log_p[:-20] if n > 50 else log_p
          x = np.arange(len(fit), dtype=float)
          slope, intercept = np.polyfit(x, fit, 1)
          resid = fit - (intercept + slope * x)
          std = float(np.std(resid, ddof=1))
          z = float((log_p[-1] - (intercept + slope * (n - 1))) / std)
          prix = float(close.iloc[-1])
          T = prix * math.exp(-z * std)

          mm21  = close.rolling(21).mean().dropna()
          mm200 = close.rolling(200).mean().dropna()

          def mois(ts): return ts.year * 12 + (ts.month - 1) + (ts.day - 1) / 31
          def sample(s):
              two_y = s.index[-1] - pd.Timedelta(days=730)
              old = s[s.index <  two_y].resample("ME").last().dropna()
              rec = s[s.index >= two_y].resample("W-FRI").last().dropna()
              out = pd.concat([old, rec])
              return [[round(mois(ts), 2), round(float(v), 2)] for ts, v in out.items()]

          tm = info.get("targetMeanPrice")
          tm = float(tm) if isinstance(tm, (int, float)) and tm == tm else None
          curr = info.get("currency", "USD")
          if tm is not None and curr == "GBp":
              tm = tm / 100  # piège pence → livres (famille de bug ×100 connue du projet)

          data = {
            "ticker": t,
            "nom": info.get("longName") or info.get("shortName") or t,
            "sector": sector, "currency": curr,
            "fenetre_label": win_label, "fenetre_jours": win_days,
            "points": sample(close), "mm21": sample(mm21), "mm200": sample(mm200),
            "prix": round(prix, 2), "z": round(z, 2), "sigma": round(std, 4),
            "pente_an": round(slope * 252 * 100, 1), "prix_tendance": round(T, 2),
            "decote_pct": round((1 - prix / T) * 100, 1),
            "t_win0": round(mois(cw.index[0]), 2), "t_last": round(mois(close.index[-1]), 2),
            "target_mean": tm,
            "target_n": info.get("numberOfAnalystOpinions"),
          }
          json.dump(data, open("notes/chart_sample.json", "w"), allow_nan=False)
          print(json.dumps({k: v for k, v in data.items() if k not in ("points", "mm21", "mm200")},
                           indent=1, ensure_ascii=False))
          print("points:", len(data["points"]), "| mm21:", len(data["mm21"]), "| mm200:", len(data["mm200"]))
          EOF

      - name: Commit échantillon sur la branche de travail
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          git add notes/chart_sample.json
          git commit -m "test: échantillon données réelles pour maquette graphique [skip ci]" || echo "Aucun changement."
          git push
