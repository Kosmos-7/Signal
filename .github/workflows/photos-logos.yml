# .github/workflows/photos-logos.yml
# Huitième passe : le logo (Wikidata P154), pour les fiches sans photo ou
# illustrées par un immeuble anonyme. Préparation différente de celle des
# photos : logo entier, centré, jamais recadré, fond choisi selon sa luminosité.
name: Logos de sociétés

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers séparés par des virgules (vide = voir « tous »)"
        type: string
        default: ""
      tous:
        description: "Toutes les fiches sans photo ou illustrées par un site"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Récupérer les logos
        run: |
          python tools/photos_logos.py \
            ${{ inputs.tickers && format('--tickers {0}', inputs.tickers) || '--tous' }}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-logos
          path: |
            photos_logos.json
            assets/titres/logos/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent.
          git add -A assets/ || true
          git add -A photos_logos.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): logos candidats [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
