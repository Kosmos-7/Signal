# .github/workflows/watchlist.yml
name: Update watchlist & portfolio

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que daily-prices.yml : sérialise les commits de données
concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (watchlist.json)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python screener.py

      - name: Run portfolio agent (portfolio.json)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python portfolio_agent.py

      - name: Generate editorial analyses (analyses.json)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_analyses.py

      - name: Commit JSON files + archive snapshot
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          git add watchlist.json portfolio.json analyses.json notes/watchlist_archive/
          if git diff --staged --quiet; then
            echo "Aucun changement cette semaine."
          else
            WEEK=$(python -c "from datetime import date; d=date.today(); print(f'Sem. {d.isocalendar()[1]} · {d.year}')")
            git commit -m "update: $WEEK — watchlist + portfolio + archive [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; echo "::error::Conflit de rebase — échec explicite (pas de push silencieusement perdu)"; exit 1; }
            git push
          fi
