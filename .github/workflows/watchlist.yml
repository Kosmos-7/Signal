# .github/workflows/watchlist.yml
name: Update watchlist & portfolio

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      screener_seul:
        # Republier les projections (watchlist.json, universe.json) sans
        # toucher au portefeuille. Utile quand une watchlist thematique change
        # en cours de semaine : le front lit universe.json, pas themes.py, donc
        # un nouveau theme reste invisible tant que le screener n'a pas tourne.
        #
        # Pourquoi une entree plutot qu'un run complet : l'agent de portefeuille
        # prendrait une decision d'achat ou de vente HORS de son calendrier
        # hebdomadaire, et cette decision s'inscrit definitivement dans
        # l'historique du portefeuille. Republier une liste ne doit pas avoir ce
        # pouvoir-la. Accessoirement les deux etapes sautees sont les seules qui
        # appellent l'API Anthropic, donc les seules qui coutent.
        description: "N'executer que le screener : ni decision de portefeuille, ni fiches editoriales"
        type: boolean
        default: false

permissions:
  contents: write

# Même groupe que daily-prices.yml : sérialise les commits de données
concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (watchlist.json)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python screener.py

      - name: Run portfolio agent (portfolio.json)
        id: agent
        if: inputs.screener_seul != true
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python portfolio_agent.py

      - name: Generate editorial analyses (analyses.json)
        id: analyses
        if: inputs.screener_seul != true
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_analyses.py

      - name: Matérialiser le post hebdo (Actualités)
        # L'analyse vit dans portfolio.json, qui ne garde que la semaine
        # courante : sans matérialisation, l'archive des posts hebdo n'existe
        # pas. Idempotent, et sans appel réseau ni API.
        run: python tools/actualites.py --hebdo-seulement

      - name: Commit JSON files + archive snapshot
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # charts/ contient un fichier par titre affichable (~190 fichiers).
          # `git add <dossier>` met aussi en scène les SUPPRESSIONS : indispensable,
          # le screener purge le graphe d'un titre sorti de tous ses thèmes.
          # charts.json a été retiré le 10/08/2026 : le front ne le chargeait
          # plus, les fiches sont servies par charts/<TICKER>.json.
          git add watchlist.json universe.json portfolio.json analyses.json notes/watchlist_archive/ charts/ actualites/

          # Garde anti-oubli : cette liste explicite a DÉJÀ laissé deux fichiers
          # au sol (charts.json en v3.3.0, universe.json en v3.5.0). Dans les deux
          # cas le job était VERT et le site servait un fichier absent — la panne
          # la plus coûteuse à diagnostiquer, parce que rien ne la signale.
          # Tout JSON de données produit et NON mis en scène fait échouer le run.
          #
          # Le pathspec '*.json' couvre charts/ sans rien y ajouter : un pathspec
          # git n'est pas un glob de shell, son '*' traverse les '/' — 'charts/AAPL.json'
          # est bien matché. Un fichier oublié dans charts/ échoue donc aussi.
          #
          # Sélection : on retient les lignes dont la 2e colonne (arbre de travail)
          # n'est PAS un espace, c'est-à-dire tout ce qui reste non mis en scène —
          # '??' (créé), ' M' (modifié), ' D' (supprimé), 'MM', 'AM'… Les états
          # pleinement stagés ('A ', 'M ', 'D ') ne matchent pas : aucun faux positif
          # sur les ~190 fichiers de charts/, qui sortent tous du git add ci-dessus.
          # ' D' est nouveau et volontaire : une purge non mise en scène laisserait
          # le site servir le graphe périmé d'un titre censé avoir disparu.
          OUBLIES=$(git status --porcelain -- '*.json' ':!package*.json' \
                    | awk 'substr($0,2,1) != " " { print $2 }' || true)
          if [ -n "$OUBLIES" ]; then
            echo "::error::Fichier(s) de données produits mais absents du commit : $OUBLIES"
            echo "Ajoutez-les à la ligne 'git add' de ce workflow."
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "Aucun changement cette semaine."
          else
            WEEK=$(python -c "from datetime import date; d=date.today(); print(f'Sem. {d.isocalendar()[1]} · {d.year}')")
            # Le message doit dire ce que le run a REELLEMENT fait : annoncer
            # « portfolio » sur un run qui n'a pas execute l'agent rendrait
            # l'historique du portefeuille illisible, or c'est precisement la
            # trace qu'on ne veut pas salir.
            if [ "${{ inputs.screener_seul }}" = "true" ]; then
              PORTEE="watchlist seule (screener, sans agent ni fiches)"
            else
              PORTEE="watchlist + portfolio + archive"
            fi
            git commit -m "update: $WEEK — $PORTEE [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; echo "::error::Conflit de rebase — échec explicite (pas de push silencieusement perdu)"; exit 1; }
            git push
          fi

      # Le continue-on-error des étapes IA permet de publier la watchlist même si
      # l'agent/les analyses échouent — MAIS le job doit finir ROUGE pour que
      # l'échec soit visible (notification GitHub) au lieu de passer des semaines
      # inaperçu (ex : clé API expirée → portfolio et analyses figés en silence).
      - name: Signale les échecs IA (après publication)
        if: steps.agent.outcome == 'failure' || steps.analyses.outcome == 'failure'
        run: |
          echo "::error::Étape IA en échec — portfolio_agent: ${{ steps.agent.outcome }}, generate_analyses: ${{ steps.analyses.outcome }}. La watchlist a été publiée, mais les données IA n'ont pas été rafraîchies."
          exit 1
