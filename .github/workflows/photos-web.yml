# .github/workflows/photos-web.yml
# Septième passe : visuels pris sur le site des sociétés elles-mêmes. AUCUNE de
# ces images n'est libre de droit. Le propriétaire du dépôt a explicitement
# autorisé leur usage ; la provenance de chacune est consignée pour qu'un
# retrait soit immédiat si la société le demande.
name: Photos de sociétés depuis leur site officiel

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      tickers:
        description: "Tickers à traiter, séparés par des virgules (vide = tous)"
        type: string
        default: ""
      par_societe:
        description: "Images téléchargées par société"
        type: string
        default: "3"

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Récupérer les visuels officiels
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          python tools/photos_web.py \
            --limite ${{ inputs.limite || '0' }} \
            --par-societe ${{ inputs.par_societe || '3' }} \
            ${TICKERS:+--tickers "$TICKERS"}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-web
          path: |
            photos_web.json
            assets/titres/web/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent. On ajoute donc separement.
          git add -A assets/ || true
          git add -A photos_web.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats sites officiels [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
