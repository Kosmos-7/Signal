# .github/workflows/photos-marques.yml
# Sixième passe : interroger Commons sur les MARQUES, les filiales, les modèles
# et les sites exploités plutôt que sur la raison sociale. Personne ne titre une
# photo « Vertiv » : on écrit « Liebert UPS ».
name: Photos de sociétés par marque et produit

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats téléchargés par société"
        type: string
        default: "3"
      ameliorer:
        description: "Repasser sur les fiches déjà illustrées jugées faibles"
        type: boolean
        default: false
      scenes:
        description: "Dirigeants présentant le produit sur scène"
        type: boolean
        default: false
      termes:
        description: "Recherche ponctuelle, format TICKER=terme|terme"
        type: string
        default: ""
      lieux:
        description: "Chercher le LIEU des fiches sans illustration"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  marques:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Chercher par marque et par produit
        # « termes » passe par l'environnement, jamais par interpolation dans le
        # script : une chaine libre interpolee telle quelle est executee par le
        # shell. Les « | » de « TICKER=a|b » avaient ete pris pour des tubes et
        # bash avait tente d'executer les termes comme des commandes. Au dela du
        # bug, c'est une injection : n'importe quelle valeur d'entree s'executait.
        # LA MÊME RÈGLE VAUT POUR LES NOMBRES, et elle manquait juste en dessous :
        # « limite » et « par_societe » sont déclarées `type: string`, donc elles
        # portent du texte libre exactement comme « termes ». Elles étaient
        # interpolées telles quelles dans le shell pendant que la ligne du dessus
        # s'en protégeait. Un motif appliqué à moitié ne protège pas à moitié.
        env:
          TERMES: ${{ inputs.termes }}
          LIMITE: ${{ inputs.limite }}
          PAR_SOCIETE: ${{ inputs.par_societe }}
        run: |
          python tools/photos_marques.py \
            --limite "${LIMITE:-0}" \
            --par-societe "${PAR_SOCIETE:-3}" \
            ${{ (inputs.ameliorer == true || inputs.ameliorer == 'true') && '--ameliorer' || '' }} \
            ${{ (inputs.lieux == true || inputs.lieux == 'true') && '--lieux' || '' }} \
            ${{ (inputs.scenes == true || inputs.scenes == 'true') && '--scenes' || '' }} \
            ${TERMES:+--termes "$TERMES"}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-marques
          path: |
            photos_marques.json
            photos_ameliorer.json
            photos_lieux.json
            photos_termes.json
            photos_scenes.json
            assets/titres/marques/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent : si le script meurt avant
          # d'ecrire son rapport, les images telechargees sont perdues.
          git add -A assets/ || true
          git add -A photos_marques.json || true
          git add -A photos_ameliorer.json || true
          git add -A photos_lieux.json || true
          git add -A photos_termes.json || true
          git add -A photos_scenes.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats par marque [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
