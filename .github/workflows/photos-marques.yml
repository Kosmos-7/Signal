# .github/workflows/photos-marques.yml
# Sixième passe : interroger Commons sur les MARQUES, les filiales, les modèles
# et les sites exploités plutôt que sur la raison sociale. Personne ne titre une
# photo « Vertiv » : on écrit « Liebert UPS ».
name: Photos de sociétés par marque et produit

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats téléchargés par société"
        type: string
        default: "3"
      ameliorer:
        description: "Repasser sur les fiches déjà illustrées jugées faibles"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  marques:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Chercher par marque et par produit
        run: |
          python tools/photos_marques.py \
            --limite ${{ inputs.limite || '0' }} \
            --par-societe ${{ inputs.par_societe || '3' }} \
            ${{ (inputs.ameliorer == true || inputs.ameliorer == 'true') && '--ameliorer' || '' }}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-marques
          path: |
            photos_marques.json
            photos_ameliorer.json
            assets/titres/marques/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent : si le script meurt avant
          # d'ecrire son rapport, les images telechargees sont perdues.
          git add -A assets/ || true
          git add -A photos_marques.json || true
          git add -A photos_ameliorer.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats par marque [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
