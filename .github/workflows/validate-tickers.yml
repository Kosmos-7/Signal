# .github/workflows/validate-tickers.yml
# Outil de maintenance — à lancer à la main AVANT tout ajout de ticker dans
# themes.py, jamais après.
#
# Raison d'être : l'environnement de développement n'a pas accès à Yahoo Finance,
# donc un symbole erroné ne se voit qu'en production — sous la forme d'un thème
# amputé publié en silence. Ce workflow confronte les symboles déclarés à l'API
# réelle depuis un runner (historique, devise Yahoo vs devise déduite du suffixe,
# secteur, capitalisation, objectif consensus).
#
# Sa première exécution (01/08/2026, 81 symboles) a écarté 3 symboles qui
# seraient passés en production : deux historiques trop courts pour qu'une
# régression signifie quoi que ce soit, et un symbole introuvable. Il paie donc
# déjà son coût — le garder.
name: Valider les tickers thématiques

on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Valider TOUS les tickers déclarés (sinon : seulement les nouveaux)"
        type: boolean
        default: false
      tickers:
        description: "Liste explicite de CANDIDATS à éprouver, séparés par des virgules (prioritaire)"
        type: string
        default: ""

# Ne touche à aucun fichier de données publié : lecture seule côté production.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Valider les tickers
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python validate_tickers.py --tickers "$TICKERS"
          else
            python validate_tickers.py ${{ inputs.tout && '--all' || '' }}
          fi

      - name: Publier le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-tickers
          path: validation_tickers.json
          retention-days: 7
