# .github/workflows/validate-tickers.yml
# Workflow TEMPORAIRE de validation — à supprimer une fois les thèmes stabilisés.
# Raison d'être : l'environnement de développement n'a pas accès à Yahoo Finance
# (proxy). Les symboles déclarés dans themes.py doivent donc être confrontés à
# l'API réelle depuis un runner avant d'élargir l'univers de production.
name: Valider les tickers thématiques

on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Valider TOUS les tickers déclarés (sinon : seulement les nouveaux)"
        type: boolean
        default: false

# Ne touche à aucun fichier de données publié : lecture seule côté production.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Valider les tickers déclarés dans themes.py
        run: python validate_tickers.py ${{ inputs.tout && '--all' || '' }}

      - name: Publier le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-tickers
          path: validation_tickers.json
          retention-days: 7
