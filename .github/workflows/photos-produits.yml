# .github/workflows/photos-produits.yml
# Cherche des photos de PRODUITS dans la catégorie Commons de chaque société,
# au lieu du siège social que renvoie Wikidata P18. Voir tools/photos_produits.py.
name: Photos de produits par société

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats retenus par société"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  produits:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Chercher les produits
        run: |
          python tools/photos_produits.py --telecharger \
            --limite ${{ inputs.limite || '0' }} \
            --par-societe ${{ inputs.par_societe || '2' }}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-produits
          path: |
            photos_produits.json
            assets/titres/produits/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent : si le script meurt avant
          # d'ecrire son rapport, les images telechargees sont perdues.
          git add -A assets/ || true
          git add -A photos_produits.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats produits par société [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
