# .github/workflows/daily-prices.yml
# Refresh quotidien des prix portfolio (pas de scoring, pas d'appel Claude)
name: Daily refresh — cours ET chiffres des fiches

on:
  schedule:
    # Lundi-Vendredi à 22h UTC (= 1h après close US 21h UTC)
    # Capture le close du jour pour chaque jour ouvré
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Sérialise les écritures de portfolio.json avec watchlist.yml (même groupe) :
# évite la course commit/rebase observée dans l'historique (conflit JSON non auto-mergeable)
concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # LES CHIFFRES DES FICHES SUIVENT LE COURS, décision du propriétaire du
      # 09/08/2026 : « on génère les fiches en hebdo ok, mais les chiffres — et
      # les chiffres repris dans les textes — je veux un update quotidien comme
      # pour le cours ». Jusqu'ici seul portfolio.json bougeait chaque soir ;
      # les multiples, marges et rendements des 148 fiches dataient du lundi.
      #
      # C'est le SCREENER SEUL qui les rafraîchit — le même programme que le run
      # hebdomadaire, sans l'agent de portefeuille ni la génération éditoriale,
      # donc SANS AUCUN appel à l'API Anthropic. Les textes, eux, restent
      # hebdomadaires : c'est ce que le propriétaire a demandé.
      - name: Rafraîchir les chiffres des fiches (screener seul, sans IA)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python screener.py

      - name: Refresh portfolio prices
        run: python update_prices.py

      - name: Commit if changed
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # L'ARCHIVE N'EST PAS COMMITÉE ICI, et c'est délibéré : le screener en
          # dépose une à chaque passage, mais notes/watchlist_archive/ est un
          # journal HEBDOMADAIRE. Y ajouter une entrée par jour ouvré en
          # changerait la nature sans que personne l'ait décidé.
          # charts.json retiré le 10/08/2026 (le front ne le chargeait plus).
          git add portfolio.json watchlist.json universe.json charts/
          if git diff --staged --quiet; then
            echo "Aucun changement (marché fermé ou jour férié)."
          else
            git commit -m "daily: cours et chiffres des fiches $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; echo "::error::Conflit de rebase sur les données quotidiennes — échec explicite (pas de push silencieusement perdu)"; exit 1; }
            git push
          fi
