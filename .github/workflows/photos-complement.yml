# .github/workflows/photos-complement.yml
# Troisième passe sur les sociétés encore sans photo : candidats Wikidata P18
# jamais rapatriés + recherche par « dépeint » (P180) dans les données
# structurées de Commons. Voir tools/photos_complement.py.
name: Photos manquantes, troisième passe

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats téléchargés par société"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  complement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Chercher les photos manquantes
        # Les entrées passent par l'environnement, jamais par interpolation dans
        # le script : `limite` et `par_societe` sont déclarées `type: string`,
        # donc elles portent du texte libre qu'un shell exécuterait. C'est la
        # règle déjà écrite dans photos-marques.yml, où un « | » dans une entrée
        # avait été pris pour un tube et exécuté.
        env:
          LIMITE: ${{ inputs.limite }}
          PAR_SOCIETE: ${{ inputs.par_societe }}
        run: |
          python tools/photos_complement.py \
            --limite "${LIMITE:-0}" \
            --par-societe "${PAR_SOCIETE:-2}"
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-complement
          path: |
            photos_complement.json
            assets/titres/complement/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent : si le script meurt avant
          # d'ecrire son rapport, les images telechargees sont perdues.
          git add -A assets/ || true
          git add -A photos_complement.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats de la troisième passe [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
