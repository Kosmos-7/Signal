# .github/workflows/photos-complement.yml
# Troisième passe sur les sociétés encore sans photo : candidats Wikidata P18
# jamais rapatriés + recherche par « dépeint » (P180) dans les données
# structurées de Commons. Voir tools/photos_complement.py.
name: Photos manquantes, troisième passe

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats téléchargés par société"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  complement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Chercher les photos manquantes
        run: |
          python tools/photos_complement.py \
            --limite ${{ inputs.limite || '0' }} \
            --par-societe ${{ inputs.par_societe || '2' }}
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-complement
          path: |
            photos_complement.json
            assets/titres/complement/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: always()
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          git add -A photos_complement.json assets/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats de la troisième passe [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
