# .github/workflows/photos-openverse.yml
# Quatrième source : Openverse, l'agrégateur de la Fondation Wikimedia (Flickr,
# musées, banques ouvertes). Corpus distinct de Commons, sans clé d'API.
name: Photos de sociétés via Openverse

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Ne traiter que les N premières sociétés (0 = toutes)"
        type: string
        default: "0"
      par_societe:
        description: "Candidats téléchargés par société"
        type: string
        default: "2"
      tickers:
        description: "Tickers à traiter, séparés par des virgules (vide = tous)"
        type: string
        default: ""
      diag:
        description: "Diagnostic seul : tester l'API et s'arrêter"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-data-commit
  cancel-in-progress: false

jobs:
  openverse:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet Pillow
      - name: Diagnostic de l'API
        if: inputs.diag == true || inputs.diag == 'true'
        run: python tools/photos_openverse.py --diag
      - name: Chercher sur Openverse
        if: ${{ inputs.diag != true && inputs.diag != 'true' }}
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          python tools/photos_openverse.py \
            --limite ${{ inputs.limite || '0' }} \
            --par-societe ${{ inputs.par_societe || '2' }} \
            ${TICKERS:+--tickers "$TICKERS"}
      - name: Publier le rapport
        if: ${{ always() && inputs.diag != true && inputs.diag != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: photos-openverse
          path: |
            photos_openverse.json
            assets/titres/openverse/
          retention-days: 7
      - name: Commiter pour arbitrage visuel
        if: ${{ always() && inputs.diag != true && inputs.diag != 'true' }}
        run: |
          git config user.email "bot@signal.fr"
          git config user.name "Signal Bot"
          # Un chemin inexistant fait echouer TOUT le git add, y compris les
          # chemins valides qui l'accompagnent : si le script meurt avant
          # d'ecrire son rapport, les images telechargees sont perdues.
          git add -A assets/ || true
          git add -A photos_openverse.json || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore(photos): candidats Openverse [skip ci]"
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            git push
          fi
