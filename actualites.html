<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités, Signal</title>
<meta name="description" content="Le point marchés du matin, écrit à partir de dépêches citées, jamais inventé, jamais interprété. Et chaque semaine, l'analyse du portefeuille IA.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M3.5 14 L7 14 L9.5 8.5 L13.5 20.5 L16.5 5 L20 14 L24.5 14' stroke='%2322d98a' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="signal.css">
<style>
  html, body { height: auto; }
  :root {
    --bg:#06060b; --surface:rgba(255,255,255,0.022); --surface2:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.07); --text:#f2f3fc; --text2:#c6c6e0; --text3:#8a8aa6;
    --ac:#74b6df; --ac-dim:rgba(116,182,223,0.10); --radius:10px; --radius-lg:16px;
    --mono:'Courier New',monospace;
  }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; position:relative; }

  main { max-width:1060px; margin:0 auto; padding:3rem 1.5rem 6rem; position:relative; z-index:1; }
  .hero h1 { font-family:Georgia,serif; font-size:2.2rem; font-weight:normal; letter-spacing:-0.5px; }
  .hero p { color:var(--text2); font-size:0.96rem; max-width:640px; line-height:1.75; margin-top:.6rem; }
  .hero-meta { font:600 .62rem var(--mono); letter-spacing:1.6px; text-transform:uppercase; color:var(--text3); margin-top:.9rem; }

  /* ── CARTES (même architecture que la homepage des watchlists) ── */
  .pgrid { display:flex; flex-direction:column; gap:1.4rem; margin-top:2.2rem; }
  .pcard { display:flex; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); overflow:hidden; text-decoration:none; color:inherit; transition:border-color .18s, background .18s; }
  .pcard:hover { border-color:var(--ac); background:var(--surface2); }
  .pc-img { flex:0 0 340px; position:relative; background:var(--surface2); min-height:190px; }
  .pc-img img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pc-img figcaption { position:absolute; left:0; right:0; bottom:0; padding:1.4rem .7rem .4rem; background:linear-gradient(180deg,transparent,rgba(6,10,18,.85)); font:600 .52rem var(--mono); letter-spacing:.5px; text-transform:uppercase; color:rgba(232,236,242,.85); }
  .pc-body { flex:1; padding:1.15rem 1.35rem 1rem; display:flex; flex-direction:column; gap:.45rem; min-width:0; }
  .pc-kind { font:600 .55rem var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--text3); border:1px solid var(--border); border-radius:3px; padding:2px 7px; align-self:flex-start; }
  .pc-kind.hebdo { color:var(--ac); border-color:var(--ac); }
  .pc-title { font-family:Georgia,serif; font-size:1.25rem; letter-spacing:-.2px; }
  .pc-date { font:600 .6rem var(--mono); letter-spacing:1.4px; text-transform:uppercase; color:var(--text3); }
  .pc-chapo { color:var(--text2); font-size:.92rem; line-height:1.65; }
  .pc-open { margin-top:auto; padding-top:.7rem; border-top:1px solid var(--border); font:600 .6rem var(--mono); letter-spacing:1.6px; text-transform:uppercase; color:var(--text3); display:flex; justify-content:space-between; }
  .pcard:hover .pc-open { color:var(--ac); }
  @media (max-width:760px){ .pcard{flex-direction:column} .pc-img{flex:none;height:180px} }

  /* ── POST ── */
  .crumb { font:600 .62rem var(--mono); letter-spacing:1.4px; text-transform:uppercase; color:var(--text3); margin-bottom:1.6rem; }
  .crumb a { color:var(--text3); text-decoration:none; } .crumb a:hover { color:var(--ac); }
  .post-kind { font:600 .55rem var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--text3); border:1px solid var(--border); border-radius:3px; padding:2px 8px; display:inline-block; }
  .post-kind.hebdo { color:var(--ac); border-color:var(--ac); }
  .post h1 { font-family:Georgia,serif; font-size:1.9rem; font-weight:normal; letter-spacing:-.4px; margin:.7rem 0 .3rem; }
  .post-date { font:600 .62rem var(--mono); letter-spacing:1.6px; text-transform:uppercase; color:var(--text3); }
  .post-illu { position:relative; margin:1.4rem 0; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
  .post-illu img { display:block; width:100%; height:auto; aspect-ratio:16/7; object-fit:cover; }
  .post-illu figcaption { position:absolute; left:0; right:0; bottom:0; padding:1.6rem .9rem .5rem; background:linear-gradient(180deg,transparent,rgba(6,10,18,.88)); font:600 .58rem var(--mono); letter-spacing:.5px; text-transform:uppercase; color:rgba(232,236,242,.85); }
  .post-illu figcaption i { display:block; font-style:normal; font-size:.52rem; text-transform:none; color:rgba(232,236,242,.55); }
  .post-chapo { font-size:1.05rem; color:var(--text2); line-height:1.75; border-left:2px solid var(--ac); padding-left:1rem; margin:1.3rem 0 1.8rem; max-width:820px; }
  .post-edit { border:1px solid rgba(224,153,94,.4); border-radius:var(--radius); padding:.8rem 1rem; margin:0 0 1.6rem; max-width:820px; font-size:.85rem; color:var(--text2); line-height:1.65; }
  .post-edit b { display:block; font:600 .58rem var(--mono); letter-spacing:1.6px; text-transform:uppercase; color:#e0995e; margin-bottom:.35rem; }
  .post h2 { font-family:Georgia,serif; font-size:1.25rem; font-weight:normal; margin:1.8rem 0 .5rem; }
  .post-texte { color:var(--text2); line-height:1.8; max-width:820px; white-space:pre-line; }
  .post-srcs { margin-top:2.6rem; border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.2rem; }
  .post-srcs h3 { font:600 .62rem var(--mono); letter-spacing:1.8px; text-transform:uppercase; color:var(--text3); margin-bottom:.7rem; }
  .src-item { padding:.45rem 0; border-top:1px solid var(--border); font-size:.85rem; color:var(--text2); }
  .src-item:first-of-type { border-top:none; }
  .src-item a { color:var(--ac); text-decoration:none; }
  .src-item .s-meta { font:600 .58rem var(--mono); letter-spacing:.8px; text-transform:uppercase; color:var(--text3); margin-left:.5rem; }
  .post-note { margin-top:1.6rem; font-size:.8rem; color:var(--text3); line-height:1.6; max-width:820px; }
  .empty { color:var(--text3); margin-top:3rem; }
</style>
</head>
<body>

<div id="fx" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header>
  <a class="brand" href="index.html">
    <span class="brand-icon">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none">
        <path d="M3.5 14 L7 14 L9.5 8.5 L13.5 20.5 L16.5 5 L20 14 L24.5 14" stroke="#22d98a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-name">Signal</span>
  </a>
  <nav>
    <a href="index.html#/">Watchlists</a>
    <a href="actualites.html" class="active">Actualités</a>
    <a href="apprendre.html">Apprendre</a>
    <a href="portfolio.html">Portefeuille IA</a>
  </nav>
</header>

<main id="app"><p class="empty">Chargement…</p></main>

<footer>
  <p>Signal est un service éditorial d'information financière. Contenu fourni à titre informatif uniquement. Ne constitue pas un conseil en investissement au sens AMF.</p>
</footer>

<script src="signal-fx.js"></script>
<script>
/* Deux vues, un hash : '#/' la liste, '#/p/<id>' un post. Les posts sont des
   fichiers immuables — seul l'index se recharge à chaque visite. */
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function sv(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dfr(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?(+m[3])+' '+MOIS[+m[2]-1]+' '+m[1]:sv(d);}
function kindOf(t){return t==='hebdo'?['hebdo','Analyse hebdo']:['quotidien','Le point du matin'];}

let INDEX=null;
function chargerIndex(){
  return INDEX?Promise.resolve(INDEX)
    :fetch('actualites/index.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(j=>{INDEX=j;return j;});
}

function liste(){
  const app=document.getElementById('app');
  chargerIndex().then(j=>{
    const posts=j.posts||[];
    app.innerHTML='<div class="hero"><h1>Actualités</h1>'+
      '<p>Que s\'est-il passé sur les marchés ? Chaque matin de bourse, le point de la veille et de la nuit, sources à l\'appui. Et chaque semaine, l\'analyse du portefeuille IA.</p>'+
      (posts.length?'<div class="hero-meta">Dernier post le '+dfr(posts[0].date)+'</div>':'')+
      '</div>'+
      (posts.length?'<div class="pgrid">'+posts.map(carte).join('')+'</div>'
        :'<p class="empty">Aucun post publié pour le moment. Le premier arrive un matin de bourse.</p>');
    window.scrollTo(0,0);
  }).catch(()=>{app.innerHTML='<div class="hero"><h1>Actualités</h1></div><p class="empty">Aucun post publié pour le moment.</p>';});
}

function carte(p){
  const [cls,label]=kindOf(p.type);
  const img=p.photo&&p.photo.src?'<figure class="pc-img"><img src="'+sv(p.photo.src)+(p.photo.v?'?v='+sv(p.photo.v):'')+'" alt="" loading="lazy">'+
      (p.photo.legende?'<figcaption>'+sv(p.photo.legende)+'</figcaption>':'')+'</figure>':'';
  return '<a class="pcard" href="#/p/'+encodeURIComponent(p.id)+'">'+img+
    '<div class="pc-body"><span class="pc-kind '+cls+'">'+label+'</span>'+
    '<div class="pc-title">'+sv(p.titre)+'</div>'+
    '<div class="pc-date">'+dfr(p.date)+'</div>'+
    '<div class="pc-chapo">'+sv(p.chapeau)+'</div>'+
    '<div class="pc-open"><span></span><span>Lire →</span></div></div></a>';
}

function post(id){
  const app=document.getElementById('app');
  fetch('actualites/posts/'+encodeURIComponent(id)+'.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(p=>{
    const [cls,label]=kindOf(p.type);
    const illu=p.photo&&p.photo.src?'<figure class="post-illu"><img src="'+sv(p.photo.src)+(p.photo.v?'?v='+sv(p.photo.v):'')+'" alt="">'+
      '<figcaption>'+sv(p.photo.legende||'')+'<i>'+sv((p.photo.credit?p.photo.credit+' · ':'')+(p.photo.licence||''))+'</i></figcaption></figure>':'';
    const edit=p.note_edition?'<div class="post-edit"><b>Note d\'édition · '+dfr(p.note_edition.date)+'</b>'+sv(p.note_edition.texte)+'</div>':'';
    const secs=(p.sections||[]).map(s=>'<h2>'+sv(s.titre)+'</h2><div class="post-texte">'+sv(s.texte)+'</div>').join('');
    const srcs=(p.sources||[]).length?'<div class="post-srcs"><h3>Sources</h3>'+
      p.sources.map(s=>'<div class="src-item">'+(s.url?'<a href="'+sv(s.url)+'" target="_blank" rel="noopener">'+sv(s.titre)+'</a>':sv(s.titre))+
        '<span class="s-meta">'+sv(s.source)+(s.date?' · '+sv(s.date):'')+'</span></div>').join('')+'</div>':'';
    const note=p.type==='hebdo'
      ?'Ce post est l\'analyse hebdomadaire de l\'IA qui gère le portefeuille fictif de Signal : c\'est une interprétation, la sienne. Le détail des positions est sur la page <a href="portfolio.html" style="color:var(--ac)">Portefeuille IA</a>.'
      :'Ce post est écrit par une IA uniquement à partir des dépêches listées ci-dessus : rien n\'y est ajouté, rien n\'y est prédit. Information, pas conseil en investissement.';
    app.innerHTML='<div class="crumb"><a href="#/">← Actualités</a></div>'+
      '<article class="post"><span class="post-kind '+cls+'">'+label+'</span>'+
      '<h1>'+sv(p.titre)+'</h1><div class="post-date">'+dfr(p.date)+'</div>'+
      illu+'<p class="post-chapo">'+sv(p.chapeau)+'</p>'+edit+secs+srcs+
      '<p class="post-note">'+note+'</p></article>';
    document.title=p.titre+', Signal';
    window.scrollTo(0,0);
  }).catch(()=>{app.innerHTML='<div class="crumb"><a href="#/">← Actualités</a></div><p class="empty">Post introuvable.</p>';});
}

function router(){
  const h=location.hash||'#/';
  const m=/^#\/p\/(.+)$/.exec(h);
  if(m)post(decodeURIComponent(m[1]));else{document.title='Actualités, Signal';liste();}
}
window.addEventListener('hashchange',router);
router();
</script>
</body>
</html>
